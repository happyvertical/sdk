# Lefthook Git Hooks Configuration
# https://github.com/evilmartians/lefthook

# Pre-commit hook: Auto-format and fix staged files
pre-commit:
  commands:
    format:
      glob: "*.{js,jsx,ts,tsx,svelte}"
      # `--no-errors-on-unmatched` is required because lefthook's glob
      # can be broader than biome's `files.includes` in biome.json —
      # top-level config files (e.g. `eslint.config.mjs` or any future
      # `*.config.{js,ts}` that biome ignores) can match the lefthook
      # glob but be skipped by biome, which exits 1 on "no files
      # processed" by default and would fail the commit. (The current
      # `commitlint.config.mjs` doesn't match the lefthook glob, so
      # this isn't a hot issue today — but the flag costs nothing and
      # matches the smrt repo's lefthook.yml pattern.)
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    validate-workflows:
      glob: ".github/workflows/*.{yml,yaml}"
      run: |
        echo "🔍 Validating workflow files..."
        for file in {staged_files}; do
          echo "  Checking $file..."
          yamllint -c .github/.yamllint.yml "$file" || exit 1
        done
        echo "  Running act --list to verify workflow parsing..."
        act --list > /dev/null 2>&1 || (echo "❌ act --list failed - workflow syntax issue" && exit 1)
        echo "✅ All workflow files validated"

# Commit-msg hook: Validate commit message format
# Skipped in CI to allow semantic-release commits
commit-msg:
  commands:
    validate:
      skip:
        - run: "[ \"$CI\" = \"true\" ]"
      run: npx --no-install commitlint --edit {1}

# Pre-push hook: Run checks before pushing
pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
      skip:
        - merge
        - rebase
