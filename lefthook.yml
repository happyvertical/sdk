# Lefthook Git Hooks Configuration
# https://github.com/evilmartians/lefthook

# Pre-commit hook: Auto-format and fix staged files
pre-commit:
  commands:
    format:
      glob: "*.{js,jsx,ts,tsx,svelte}"
      run: pnpm biome check --write {staged_files}
      stage_fixed: true

# Commit-msg hook: Validate commit message format
commit-msg:
  commands:
    validate:
      run: npx --no-install commitlint --edit {1}

# Pre-push hook: Run checks before pushing
pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
      skip:
        - merge
        - rebase
    format:
      run: pnpm biome ci --formatter-enabled=true --linter-enabled=false --organize-imports-enabled=false
      skip:
        - merge
        - rebase
