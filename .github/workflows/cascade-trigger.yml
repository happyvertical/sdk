name: Dependency Cascade Trigger

on:
  # Trigger when packages are published
  workflow_run:
    workflows: ["On Merge Main"]
    types: [completed]
    branches: [main]

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repository to update (leave empty for all)'
        required: false
        type: string
      dry_run:
        description: 'Dry run mode (no actual triggers)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  trigger-smrt:
    name: Trigger SMRT Update
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' ||
        github.event_name == 'workflow_dispatch'
      }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get version bump info
        id: version
        run: |
          # Get the latest version from any package.json
          version=$(node -p "require('./packages/ai/package.json').version")
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "📦 SDK version: $version"

      - name: Check if version changed
        id: check
        run: |
          # Compare with previous commit
          current=$(node -p "require('./packages/ai/package.json').version")
          git checkout HEAD~1
          previous=$(node -p \
            "require('./packages/ai/package.json').version" \
            2>/dev/null || echo "0.0.0")

          if [ "$current" != "$previous" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Version changed: $previous → $current"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭️  Version unchanged, skipping cascade"
          fi

      - name: Get downstream targets
        id: downstream
        run: |
          # Read cascade config
          downstream=$(node -e "
            const config = require('./.github/cascade-config.json');
            const sdk = config.cascade.sdk;
            const repos = sdk.triggers.map(t => config.cascade[t].repository);
            console.log(JSON.stringify(repos));
          ")
          echo "repositories=$downstream" >> $GITHUB_OUTPUT
          echo "📋 Downstream targets: $downstream"

      - name: Trigger downstream repositories
        if: >-
          steps.check.outputs.changed == 'true' &&
          github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          repositories='${{ steps.downstream.outputs.repositories }}'

          for repo in $(echo $repositories | jq -r '.[]'); do
            echo "🚀 Triggering: $repo"

            gh workflow run on-merge-main.yml \
              --repo "$repo" \
              --ref main \
              --field upstream_package="@happyvertical/*" \
              --field upstream_version="${{ steps.version.outputs.version }}" \
              --field triggered_by="${{ github.actor }}"

            if [ $? -eq 0 ]; then
              echo "✅ Triggered: $repo"
            else
              echo "❌ Failed to trigger: $repo"
            fi
          done

      - name: Dry run info
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "🧪 DRY RUN MODE"
          echo "Would trigger: ${{ steps.downstream.outputs.repositories }}"
          echo "SDK version: ${{ steps.version.outputs.version }}"

      - name: Summary
        run: |
          echo "### Cascade Triggered 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          version="${{ steps.version.outputs.version }}"
          echo "- **SDK Version:** $version" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** happyvertical/smrt" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Next steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. SMRT will update SDK dependencies" >> $GITHUB_STEP_SUMMARY
          echo "2. SMRT will run tests" >> $GITHUB_STEP_SUMMARY
          echo "3. SMRT will publish if tests pass" >> $GITHUB_STEP_SUMMARY
          echo "4. Downstream projects will be updated" >> $GITHUB_STEP_SUMMARY
