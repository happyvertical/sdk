name: Shared PR Handler

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'Pull request number'
        required: true
        type: number
      pr_title:
        description: 'Pull request title'
        required: true
        type: string
      pr_body:
        description: 'Pull request body'
        required: true
        type: string
      repo_owner:
        description: 'Repository owner'
        required: true
        type: string
      repo_name:
        description: 'Repository name'
        required: true
        type: string
    secrets:
      GH_TOKEN:
        description: 'GitHub token for API access'
        required: true

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  handle-pr:
    runs-on: arc-happyvertical
    steps:
      - name: Link PR to Issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const prNumber = ${{ inputs.pr_number }};
            const prTitle = `${{ inputs.pr_title }}`;
            const prBody = `${{ inputs.pr_body }}` || '';

            console.log(`Processing PR #${prNumber}`);

            // Extract issue references from PR body
            const issuePattern = /#(\d+)|(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/gi;
            const matches = [...prBody.matchAll(issuePattern)];
            const linkedIssues = [...new Set(matches.map(m => m[1] || m[2]).filter(Boolean))];

            console.log(`Found ${linkedIssues.length} linked issues:`, linkedIssues);

            // Add labels based on PR title/type
            const labels = [];

            if (prTitle.startsWith('feat:') || prTitle.startsWith('feat(')) {
              labels.push('type: feature');
            } else if (prTitle.startsWith('fix:') || prTitle.startsWith('fix(')) {
              labels.push('type: bug');
            } else if (prTitle.startsWith('docs:') || prTitle.startsWith('docs(')) {
              labels.push('type: docs');
            } else if (prTitle.startsWith('chore:') || prTitle.startsWith('refactor:')) {
              labels.push('type: maintenance');
            }

            if (labels.length > 0) {
              console.log(`Adding labels:`, labels);
              await github.rest.issues.addLabels({
                owner: '${{ inputs.repo_owner }}',
                repo: '${{ inputs.repo_name }}',
                issue_number: prNumber,
                labels: labels
              });
            }

            console.log('✅ PR processing complete');
