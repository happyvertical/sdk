# =============================================================================
# EDITABLE WORKFLOW - Customize for SDK
# =============================================================================
# This workflow is called by .github/workflows/happyvertical/on-merge-main.yml
# when code is merged to the main branch, after tests pass.
#
# Customize the build process for the SDK below.
# =============================================================================

name: Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: |
            ${{ runner.os }}-turbo-build-${{
              hashFiles('**/pnpm-lock.yaml')
            }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-
            ${{ runner.os }}-turbo-

      - name: Build packages
        run: pnpm run build
