name: On Merge Main

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run in dry-run mode (no actual release)'
        required: false
        default: 'false'
        type: boolean

      skip-docs:
        description: 'Skip documentation deployment'
        required: false
        default: 'false'
        type: boolean

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write
  pages: write

jobs:
  # Job 1: Run test suite
  test:
    name: Test Suite
    uses: ./.github/workflows/test-suite.yml
    with:
      runner: 'ubuntu-latest'
      node-version: '24'

  # Job 2: Build and release (only if tests pass)
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [test]
    if: needs.test.outputs.success == 'true'

    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build packages
        run: pnpm run build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 3: Deploy documentation (only if build succeeds)
  # Note: We deploy docs on every merge to main to ensure they stay in sync
  # Skip only if explicitly requested via workflow_dispatch
  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: [build-and-release]
    if: |
      always() &&
      needs.build-and-release.result == 'success' &&
      github.event.inputs.skip-docs != 'true'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-docs-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-docs-
            ${{ runner.os }}-turbo-

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build documentation site
        run: pnpm run docs:site:build
        env:
          NODE_OPTIONS: --max_old_space_size=8192

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4