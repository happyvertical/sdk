name: On Merge Main

on:
  push:
    branches: [main]

  # Handle cascade events from upstream dependencies
  repository_dispatch:
    types: [dependency-updated, sdk-updated]

  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run in dry-run mode (no actual release)'
        required: false
        default: 'false'
        type: boolean

      skip-docs:
        description: 'Skip documentation deployment'
        required: false
        default: 'false'
        type: boolean

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write
  pages: write
  actions: write

jobs:
  # Job 0: Update dependencies if triggered by cascade
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch'

    outputs:
      pr_number: ${{ steps.create-pr.outputs.pull-request-number }}
      pr_url: ${{ steps.create-pr.outputs.pull-request-url }}
      updated: ${{ steps.check-updates.outputs.updated }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      - name: Update @happyvertical dependencies
        id: update
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Updating @happyvertical dependencies..."
          pnpm update '@happyvertical/*' --latest
          pnpm install

      - name: Check for updates
        id: check-updates
        run: |
          if git diff --quiet package.json pnpm-lock.yaml 2>/dev/null; then
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "⏭️  No updates needed"
          else
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "✅ Dependencies updated"

            # Show updated packages
            git diff package.json | grep '^\+.*@happyvertical' | sed 's/^+//' > /tmp/updates.txt || true
            if [ -s /tmp/updates.txt ]; then
              echo "📦 Updated packages:"
              cat /tmp/updates.txt
            fi
          fi

      - name: Create Pull Request
        id: create-pr
        if: steps.check-updates.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_TOKEN }}
          commit-message: 'chore: update @happyvertical dependencies'
          title: 'chore: update @happyvertical dependencies'
          body: |
            ## Automated Dependency Update 🤖

            This PR was automatically created by the dependency cascade system.

            ### Upstream Changes
            ${{ github.event.client_payload.package && format('- **Package:** {0}', github.event.client_payload.package) || '' }}
            ${{ github.event.client_payload.version && format('- **Version:** {0}', github.event.client_payload.version) || '' }}
            ${{ github.event.client_payload.repository && format('- **Source:** {0}', github.event.client_payload.repository) || '' }}

            ### Next Steps
            - ✅ Dependencies updated
            - 🧪 Tests will run automatically
            - 📦 Will auto-merge if tests pass

            ---
            *This PR will be automatically merged when all checks pass*
          branch: cascade/update-dependencies
          delete-branch: true
          labels: dependencies,automated

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "🔀 Enabling auto-merge for PR #${{ steps.create-pr.outputs.pull-request-number }}"
          gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} \
            --auto --squash \
            --delete-branch

  # Job 1: Cancel in-progress PR validation runs
  cancel-pr-validation:
    name: Cancel In-Progress PR Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get PR number from merge commit
        id: pr
        run: |
          # Extract PR number from merge commit message (first occurrence only)
          PR_NUMBER=$(git log -1 --pretty=%B | grep -oP '#\K\d+' | head -1 || echo "")
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

          if [ -n "$PR_NUMBER" ]; then
            echo "✅ Found PR #${PR_NUMBER}"
          else
            echo "⏭️  No PR number found in commit message (direct push)"
          fi

      - name: Cancel in-progress PR validation runs
        if: steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ steps.pr.outputs.pr_number }}

          echo "Checking for in-progress validation runs for PR #${PR_NUMBER}..."

          # Find the workflow ID for "Pull Request Validation"
          WORKFLOW_ID=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/actions/workflows \
            --jq '.workflows[] | select(.name == "Pull Request Validation") | .id')

          if [ -z "$WORKFLOW_ID" ]; then
            echo "❌ Pull Request Validation workflow not found"
            exit 0
          fi

          echo "✅ Found workflow ID: ${WORKFLOW_ID}"

          # Get in-progress runs for this workflow and PR
          RUNS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/actions/workflows/${WORKFLOW_ID}/runs?status=in_progress&event=pull_request" \
            --jq ".workflow_runs[] | select(.pull_requests[0].number == ${PR_NUMBER}) | .id")

          if [ -z "$RUNS" ]; then
            echo "✅ No in-progress validation runs found for PR #${PR_NUMBER}"
            exit 0
          fi

          # Cancel each in-progress run
          echo "$RUNS" | while read -r RUN_ID; do
            echo "🚫 Cancelling run: ${RUN_ID}"
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${{ github.repository }}/actions/runs/${RUN_ID}/cancel"
            echo "✅ Cancelled run: ${RUN_ID}"
          done

          echo "✅ All in-progress validation runs cancelled for PR #${PR_NUMBER}"

  # Job 2: Run test suite (only once!)
  test:
    name: Test Suite
    needs: [update-dependencies]
    # Run tests if:
    # - Update dependencies succeeded (cascade event)
    # - OR this is a normal push/workflow_dispatch (not cascade event)
    if: |
      always() &&
      (needs.update-dependencies.result == 'success' || github.event_name != 'repository_dispatch')
    uses: ./.github/workflows/test-suite.yml
    with:
      runner: 'ubuntu-latest'
      node-version: '24'

  # Job 3: Create version PR or publish packages (only on push, not cascades)
  changesets:
    name: Create Version PR or Publish
    runs-on: ubuntu-latest
    needs: [test]
    if: |
      always() &&
      needs.test.outputs.success == 'true' &&
      github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Create Version PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for version PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "🔀 Enabling auto-merge for version PR #${{ steps.changesets.outputs.pullRequestNumber }}"
          gh pr merge ${{ steps.changesets.outputs.pullRequestNumber }} \
            --auto --squash \
            --delete-branch

      - name: Create git tags
        if: steps.changesets.outputs.published == 'true'
        run: |
          # Create tags for each published package
          echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | "\(.name)@\(.version)"' | while read tag; do
            echo "🏷️  Creating tag: $tag"
            git tag "$tag" || echo "Tag $tag already exists"
          done

          git push --tags || echo "No new tags to push"

      - name: Trigger dependency cascade
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "📢 Triggering dependency cascade for downstream repositories..."

          # Extract published packages info
          PUBLISHED_PACKAGES='${{ steps.changesets.outputs.publishedPackages }}'
          echo "Published packages: $PUBLISHED_PACKAGES"

          # Trigger SMRT with full package information
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/happyvertical/smrt/dispatches \
            -f event_type='dependency-updated' \
            -f 'client_payload[repository]=happyvertical/sdk' \
            -f "client_payload[packages]=$PUBLISHED_PACKAGES"

          echo "✅ Triggered SMRT dependency cascade"

  # Job 4: Deploy documentation (only on push, not cascades)
  # Note: We deploy docs on every merge to main to ensure they stay in sync
  # Skip only if explicitly requested via workflow_dispatch
  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: [test]
    if: |
      always() &&
      needs.test.outputs.success == 'true' &&
      github.event_name == 'push' &&
      github.event.inputs.skip-docs != 'true'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-docs-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-docs-
            ${{ runner.os }}-turbo-

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build documentation site
        run: pnpm run docs:site:build
        env:
          NODE_OPTIONS: --max_old_space_size=8192

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
