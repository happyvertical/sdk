name: On Merge Main

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run in dry-run mode (no actual release)'
        required: false
        default: 'false'
        type: boolean

      skip-docs:
        description: 'Skip documentation deployment'
        required: false
        default: 'false'
        type: boolean

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write
  pages: write
  actions: write

jobs:
  # Job 0: Cancel in-progress PR validation runs
  cancel-pr-validation:
    name: Cancel In-Progress PR Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get PR number from merge commit
        id: pr
        run: |
          # Extract PR number from merge commit message (first occurrence only)
          PR_NUMBER=$(git log -1 --pretty=%B | grep -oP '#\K\d+' | head -1 || echo "")
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

          if [ -n "$PR_NUMBER" ]; then
            echo "✅ Found PR #${PR_NUMBER}"
          else
            echo "⏭️  No PR number found in commit message (direct push)"
          fi

      - name: Cancel in-progress PR validation runs
        if: steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ steps.pr.outputs.pr_number }}

          echo "Checking for in-progress validation runs for PR #${PR_NUMBER}..."

          # Find the workflow ID for "Pull Request Validation"
          WORKFLOW_ID=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/actions/workflows \
            --jq '.workflows[] | select(.name == "Pull Request Validation") | .id')

          if [ -z "$WORKFLOW_ID" ]; then
            echo "❌ Pull Request Validation workflow not found"
            exit 0
          fi

          echo "✅ Found workflow ID: ${WORKFLOW_ID}"

          # Get in-progress runs for this workflow and PR
          RUNS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/actions/workflows/${WORKFLOW_ID}/runs?status=in_progress&event=pull_request" \
            --jq ".workflow_runs[] | select(.pull_requests[0].number == ${PR_NUMBER}) | .id")

          if [ -z "$RUNS" ]; then
            echo "✅ No in-progress validation runs found for PR #${PR_NUMBER}"
            exit 0
          fi

          # Cancel each in-progress run
          echo "$RUNS" | while read -r RUN_ID; do
            echo "🚫 Cancelling run: ${RUN_ID}"
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${{ github.repository }}/actions/runs/${RUN_ID}/cancel"
            echo "✅ Cancelled run: ${RUN_ID}"
          done

          echo "✅ All in-progress validation runs cancelled for PR #${PR_NUMBER}"

  # Job 1: Run test suite
  test:
    name: Test Suite
    uses: ./.github/workflows/test-suite.yml
    with:
      runner: 'ubuntu-latest'
      node-version: '24'

  # Job 2: Create version PR or publish packages
  changesets:
    name: Create Version PR or Publish
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && needs.test.outputs.success == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Create Version PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for version PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "🔀 Enabling auto-merge for version PR #${{ steps.changesets.outputs.pullRequestNumber }}"
          gh pr merge ${{ steps.changesets.outputs.pullRequestNumber }} \
            --auto --squash \
            --delete-branch

      - name: Create git tags
        if: steps.changesets.outputs.published == 'true'
        run: |
          # Create tags for each published package
          echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | "\(.name)@\(.version)"' | while read tag; do
            echo "🏷️  Creating tag: $tag"
            git tag "$tag" || echo "Tag $tag already exists"
          done

          git push --tags || echo "No new tags to push"

      - name: Trigger dependency cascade
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "📢 Triggering dependency cascade for downstream repositories..."

          # Extract published packages info
          PUBLISHED_PACKAGES='${{ steps.changesets.outputs.publishedPackages }}'
          echo "Published packages: $PUBLISHED_PACKAGES"

          # Trigger SMRT with full package information
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/happyvertical/smrt/dispatches \
            -f event_type='dependency-updated' \
            -f 'client_payload[repository]=happyvertical/sdk' \
            -f "client_payload[packages]=$PUBLISHED_PACKAGES"

          echo "✅ Triggered SMRT dependency cascade"

  # Job 3: Deploy documentation (only if tests pass)
  # Note: We deploy docs on every merge to main to ensure they stay in sync
  # Skip only if explicitly requested via workflow_dispatch
  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: [test]
    if: |
      always() &&
      needs.test.outputs.success == 'true' &&
      github.event.inputs.skip-docs != 'true'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-docs-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-docs-
            ${{ runner.os }}-turbo-

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build documentation site
        run: pnpm run docs:site:build
        env:
          NODE_OPTIONS: --max_old_space_size=8192

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4