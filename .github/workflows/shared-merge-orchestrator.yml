name: Shared Merge Orchestrator

on:
  workflow_call:
    inputs:
      repo_owner:
        description: 'Repository owner'
        required: true
        type: string
      repo_name:
        description: 'Repository name'
        required: true
        type: string
      ref:
        description: 'Git ref'
        required: true
        type: string
    secrets:
      GITHUB_TOKEN:
        description: 'GitHub token for API access'
        required: true
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  noop:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ Reusable workflow - use workflow_call to invoke"

  test:
    if: github.event_name == 'workflow_call' && hashFiles('.github/workflows/test.yml') != ''
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build:
    needs: test
    if: github.event_name == 'workflow_call' && always() && (needs.test.result == 'success' || needs.test.result == 'skipped') && hashFiles('.github/workflows/build.yml') != ''
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    needs: build
    if: github.event_name == 'workflow_call' && always() && (needs.build.result == 'success' || needs.build.result == 'skipped') && hashFiles('.github/workflows/publish.yml') != ''
    uses: ./.github/workflows/publish.yml
    secrets: inherit

  summary:
    needs: [test, build, publish]
    if: github.event_name == 'workflow_call' && always()
    runs-on: ubuntu-latest
    steps:
      - name: Workflow Summary
        run: |
          echo "## Merge Orchestration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Test**: ${{ needs.test.result || 'skipped (no test.yml)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: ${{ needs.build.result || 'skipped (no build.yml)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Publish**: ${{ needs.publish.result || 'skipped (no publish.yml)' }}" >> $GITHUB_STEP_SUMMARY
