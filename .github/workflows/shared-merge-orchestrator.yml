name: Shared Merge Orchestrator

on:
  workflow_call:
    inputs:
      repo_owner:
        description: 'Repository owner'
        required: true
        type: string
      repo_name:
        description: 'Repository name'
        required: true
        type: string
      ref:
        description: 'Git ref'
        required: true
        type: string
    secrets:
      HAVE_RELEASE_APP_ID:
        description: 'GitHub App ID for release automation'
        required: true
      HAVE_RELEASE_APP_PRIVATE_KEY:
        description: 'GitHub App private key for release automation'
        required: true

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write
  pages: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build:
    needs: test
    if: |
      always() && (needs.test.result == 'success' ||
      needs.test.result == 'skipped')
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    needs: build
    if: |
      always() && (needs.build.result == 'success' ||
      needs.build.result == 'skipped')
    uses: ./.github/workflows/publish.yml
    secrets: inherit

  summary:
    needs: [test, build, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Workflow Summary
        run: |
          echo "## Merge Orchestration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          test_result="${{ needs.test.result || 'skipped (no test.yml)' }}"
          echo "- **Test**: $test_result" >> $GITHUB_STEP_SUMMARY
          build_result="${{ needs.build.result || 'skipped (no build.yml)' }}"
          echo "- **Build**: $build_result" >> $GITHUB_STEP_SUMMARY
          result="${{ needs.publish.result || 'skipped (no publish.yml)' }}"
          echo "- **Publish**: $result" >> $GITHUB_STEP_SUMMARY
