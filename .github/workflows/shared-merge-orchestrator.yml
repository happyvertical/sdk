name: Shared Merge Orchestrator

on:
  workflow_call:
    inputs:
      repo_owner:
        description: 'Repository owner'
        required: true
        type: string
      repo_name:
        description: 'Repository name'
        required: true
        type: string
      ref:
        description: 'Git ref'
        required: true
        type: string
    secrets:
      HAVE_RELEASE_APP_ID:
        description: 'GitHub App ID for release automation'
        required: true
      HAVE_RELEASE_APP_PRIVATE_KEY:
        description: 'GitHub App private key for release automation'
        required: true
      NPM_TOKEN:
        description: 'npm automation token for publishing public packages'
        required: true

permissions:
  contents: write
  packages: read
  pull-requests: write
  id-token: write
  pages: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  # Build is combined with publish to avoid redundant builds
  # The publish workflow handles building before publishing
  publish:
    needs: test
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    uses: ./.github/workflows/publish.yml
    secrets: inherit

  summary:
    needs: [test, publish]
    if: always()
    runs-on: arc-happyvertical
    steps:
      - name: Workflow Summary
        run: |
          echo "## Merge Orchestration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          test_result="${{ needs.test.result || 'skipped (no test.yml)' }}"
          echo "- **Test**: $test_result" >> $GITHUB_STEP_SUMMARY
          publish_result="${{ needs.publish.result || 'skipped (no publish.yml)' }}"
          publish_reason="${{ needs.publish.outputs.reason || '' }}"
          publish_version="${{ needs.publish.outputs.version || '' }}"

          if [ "$publish_result" != "success" ]; then
            echo "- **Build + Publish**: $publish_result" >> $GITHUB_STEP_SUMMARY
          elif [ -n "$publish_version" ]; then
            echo "- **Build + Publish**: success (published v$publish_version)" >> $GITHUB_STEP_SUMMARY
          elif [ "$publish_reason" = "no_version_changes" ]; then
            echo "- **Build + Publish**: success (no version changes detected)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Build + Publish**: success" >> $GITHUB_STEP_SUMMARY
          fi
