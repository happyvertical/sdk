name: Pull Request Validation

on:
  # GitHub loads this workflow from the trusted base branch. That keeps runner
  # selection out of a contributor-controlled merge commit.
  pull_request_target:
    branches: [main, dependency-updates]
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number ||
      github.event.merge_group.head_sha ||
      github.ref
    }}-${{
      (github.event_name == 'pull_request_target' &&
      github.event.action == 'edited' &&
      github.event.changes.title != null &&
      github.event.changes.base == null) &&
      'title' ||
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
      !contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) &&
      !(github.event.action == 'edited' && github.event.changes.base != null))) &&
      'lifecycle' ||
      'validation'
    }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  packages: read

env:
  # Reusable workflows receive the reviewed head only for repository-owned
  # branches. Fork PR jobs are skipped before self-hosted allocation.
  CHECKOUT_REF: >-
    ${{ github.event_name == 'pull_request_target' &&
    github.event.pull_request.head.repo.full_name == github.repository &&
    github.event.pull_request.head.sha || github.sha }}

# Every self-hosted job in this trusted-base wrapper keeps the same-repository
# guard. GitHub evaluates a job-level `if` before allocating its runner, so
# fork PRs are skipped before they can reach the brokered pool.
jobs:

  changeset-check:
    name: Check for Changeset
    runs-on: arc-happyvertical
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) &&
      github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Check for skip conditions
        if: github.event_name == 'pull_request_target'
        id: skip-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          if gh pr view "$PR_NUM" --json labels \
             --jq '.labels[].name' | grep -q 'skip-changeset'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ Will skip (skip-changeset label present)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Environment
        if: github.event_name == 'pull_request_target' && steps.skip-check.outputs.skip != 'true'
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          github-packages-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changeset
        if: github.event_name == 'pull_request_target' && steps.skip-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          if gh pr view "$PR_NUM" --json labels \
             --jq '.labels[].name' | grep -q 'skip-changeset'; then
            echo "✅ Skipping changeset check (skip-changeset label present)"
            exit 0
          fi

          if echo "$PR_BRANCH" | grep -q '^renovate/'; then
            echo "✅ Skipping changeset check (Renovate dependency update PR from $PR_BRANCH)"
            exit 0
          fi

          echo ""
          echo "🔍 Checking for conventional commits..."

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          RELEASEABLE_COMMITS=$(git log \
            $BASE_SHA..$HEAD_SHA --pretty=format:"%s" --no-merges | \
            grep -E '^(feat|fix|perf)(\(.+\))?!?:|^chore\(deps\)!?:|BREAKING CHANGE' \
            || true)

          if [ -n "$RELEASEABLE_COMMITS" ]; then
            echo "✅ Found conventional commits that will trigger auto-changeset on merge:"
            echo "$RELEASEABLE_COMMITS"
            echo ""
            echo "🔍 Validating changeset:auto script can generate changesets..."

            if pnpm run changeset:auto; then
              echo "✅ changeset:auto validation passed"
              echo ""
              echo "Generated changesets will be created automatically when this change reaches main."
              exit 0
            else
              echo "❌ ERROR: changeset:auto script failed"
              echo ""
              echo "The auto-changeset generation script encountered an error."
              echo "Please check the script or add a manual changeset."
              exit 1
            fi
          fi

          echo "ℹ️  No releaseable conventional commits found"
          echo "(feat, fix, perf, chore(deps), or breaking changes)"
          echo ""

          changeset_count=$(find .changeset -name '*.md' \
            ! -name 'README.md' 2>/dev/null | wc -l)

          if [ "$changeset_count" -eq 0 ]; then
            echo "✅ No explicit changeset required for this PR"
            echo ""
            echo "This PR can merge without a version bump until its changes reach main,"
            echo "where non-merge commits (including squash/rebase commits) are"
            echo "evaluated by the on-main auto changeset rules."
            exit 0
          fi

          echo "✅ Found $changeset_count changeset(s)"
          find .changeset -name '*.md' ! -name 'README.md' -exec basename {} \;

          echo ""
          echo "🔍 Validating changeset types..."

          if find .changeset -name '*.md' ! -name 'README.md' \
             -type f -exec grep -l '"major"' {} + 2>/dev/null | \
             grep -q .; then
            echo "❌ ERROR: Major version bump detected in changeset!"
            echo ""
            echo "Files with major bumps:"
            find .changeset -name '*.md' ! -name 'README.md' \
              -type f -exec grep -l '"major"' {} + 2>/dev/null || true
            echo ""
            echo "Major version releases (1.0.0+) must be manually approved and coordinated."
            echo "Please change the version bump type to 'minor' or 'patch'."
            echo ""
            echo "If you truly need a major version bump, coordinate with maintainers first."
            exit 1
          fi

          echo "✅ No major version bumps detected"

  validate-commits:
    name: Validate Conventional Commits
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: arc-happyvertical
    permissions:
      contents: read
      pull-requests: write
      packages: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        with:
          configFile: commitlint.config.mjs

      # PR title validation only needs commitlint, not the full
      # workspace setup. Avoid ./.github/actions/setup-environment here
      # because that composite action installs apt packages and the
      # complete workspace dependency graph on the self-hosted runner.
      - name: Setup Node.js for PR title validation
        if: github.event_name == 'pull_request_target'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.18.0'

      - name: Install commitlint dependencies
        if: github.event_name == 'pull_request_target'
        run: |
          npm install --prefix "$RUNNER_TEMP/commitlint" --no-save \
            --ignore-scripts --no-audit --no-fund \
            @commitlint/cli@20.5.0 \
            @commitlint/config-conventional@20.5.0

      - name: Validate PR title for squash merge
        if: github.event_name == 'pull_request_target'
        # PR title is user-controlled metadata. Two non-obvious risks
        # the previous form had:
        #   (1) Interpolating the title directly into a shell script
        #       lets a title with command substitution execute the
        #       substitution at the runner's shell — real command
        #       injection, especially on the brokered
        #       arc-happyvertical runner this workflow runs on. Pass
        #       via env: instead, then quote the variable expansion.
        #   (2) scripts/validate-conventional-commits.js uses a
        #       hardcoded regex with permissive scope and a 50-char
        #       subject limit. Titles that pass the commit-validate
        #       job's commitlint config (with strict scope-enum +
        #       100-char limit) could STILL be rejected here, AND
        #       titles that fail commitlint's scope-enum could
        #       squash-merge cleanly. Replace the regex check with
        #       commitlint using the same config the commit
        #       validator uses, so both gates speak with one voice.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # printf instead of echo: avoids the leading-dash flag trap
          # (a title starting with -e/-n/-E would be eaten by echo).
          # NODE_PATH lets the repository config resolve its conventional
          # preset from the standalone temp install. No workspace package or
          # private registry dependency is installed by this metadata job.
          printf 'Validating PR title (length=%s)\n' "${#PR_TITLE}"
          printf '%s\n' "$PR_TITLE" | \
            NODE_PATH="$RUNNER_TEMP/commitlint/node_modules" \
            "$RUNNER_TEMP/commitlint/node_modules/.bin/commitlint" \
              --config commitlint.config.mjs

      - name: Determine version bump
        if: github.event_name == 'pull_request_target'
        id: version
        run: |
          base_ref="${{ github.event.pull_request.base.ref }}"
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          commits=$(git log "$base_sha..$head_sha" --no-merges --pretty=format:"%s")

          bump="patch"
          if echo "$commits" | grep -qE "^feat(\(.+\))?!?:"; then
            bump="minor"
          fi

          if echo "$commits" | grep -qiE "(BREAKING CHANGE|!:)"; then
            bump="minor"  # Treat as minor until 1.0.0
          fi

          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          if [ "$base_ref" = "main" ]; then
            echo "📦 Merging to main will perform a $bump version bump"
          else
            echo "📦 This PR contributes a $bump release signal when $base_ref later reaches main"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const bump = '${{ steps.version.outputs.bump }}';
            const baseRef = '${{ steps.version.outputs.base_ref }}';
            const directToMain = baseRef === 'main';
            const intro = directToMain
              ? `When this PR is merged into \`main\`, packages will receive a **${bump}** version bump based on your conventional commits.`
              : `When this PR is merged into \`${baseRef}\`, it will contribute a **${bump}** release signal. Packages are versioned and published later, when \`${baseRef}\` is merged into \`main\`.`;
            const steps = directToMain
              ? [
                  '1. Tests run on the main branch',
                  '2. Packages are built',
                  '3. Versions are bumped automatically',
                  '4. The release commit is pushed back to `main`',
                  '5. Packages are published to public npm',
                  '6. Git tags are created'
                ]
              : [
                  '1. Tests run on the integration branch',
                  `2. This change accumulates on \`${baseRef}\``,
                  `3. When \`${baseRef}\` is later merged into \`main\`, release automation versions and publishes the accumulated dependency updates`
                ];

            const comment = [
              '## 📦 Version Bump Preview',
              '',
              intro,
              '',
              '### What happens on merge?',
              '',
              ...steps
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existingComment = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Version Bump Preview')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

  validate-workflows:
    name: Validate Workflow Files
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: arc-happyvertical

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Get changed workflow files
        id: changed-files
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c # v45
        with:
          files: .github/workflows/*.{yml,yaml}

      - name: Validate workflow syntax
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "🔍 Validating workflow files..."
          files="${{ steps.changed-files.outputs.all_changed_files }}"
          echo "Changed files: $files"

          python3 -m pip install --user yamllint

          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "  Checking $file..."
            "$HOME/.local/bin/yamllint" -c .github/.yamllint.yml "$file" || exit 1
          done

          echo "✅ YAML syntax validation passed"

      - name: Validate with actionlint
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          bash <(curl -sSfL \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            ./actionlint -config-file .github/actionlint.yaml \
              -ignore 'SC2086|SC2094|SC2129' "$file"
          done

      - name: Workflow validation summary
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "✅ All workflow validations passed:"
          echo "  - YAML syntax validated with yamllint"
          echo "  - Workflow expressions validated with actionlint"

  check-naming:
    name: Check for stale @have/ references
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: arc-happyvertical

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Get changed markdown files
        id: changed-md
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c # v45
        with:
          files: '**/*.md'

      - name: Check for @have/ naming regressions in changed files
        if: steps.changed-md.outputs.any_changed == 'true'
        run: |
          echo "Checking changed markdown files for stale @have/ references..."

          found=false
          for file in ${{ steps.changed-md.outputs.all_changed_files }}; do
            if grep -n '@have/' "$file" 2>/dev/null; then
              echo "::error file=$file::Found stale @have/ reference. Should be @happyvertical/."
              found=true
            fi
          done

          if [ "$found" = true ]; then
            exit 1
          fi

          echo "No stale @have/ references found in changed files."

  doc-coverage:
    name: Check documentation coverage
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: arc-happyvertical

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c # v45
        with:
          files: |
            packages/*/src/**

      - name: Check doc coverage for changed packages
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Checking documentation coverage for changed packages..."

          packages=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" | \
            tr ' ' '\n' | \
            sed -n 's|.*packages/\([^/]*\)/.*|\1|p' | \
            sort -u)

          missing=false
          for pkg in $packages; do
            echo "Checking package: $pkg"

            if [ ! -f "packages/$pkg/README.md" ]; then
              echo "::warning file=packages/$pkg::Missing packages/$pkg/README.md"
              missing=true
            fi

            if [ ! -f "packages/$pkg/AGENT.md" ]; then
              echo "::warning file=packages/$pkg::Missing packages/$pkg/AGENT.md"
              missing=true
            fi

            if [ ! -f "packages/$pkg/metadata.json" ]; then
              echo "::warning file=packages/$pkg::Missing packages/$pkg/metadata.json"
              missing=true
            fi
          done

          if [ "$missing" = false ]; then
            echo "All changed packages have README.md, AGENT.md, and metadata.json files."
          fi

      - name: Check ecosystem manifest freshness
        if: steps.changed-files.outputs.any_changed == 'true'
        run: node scripts/sync-agent-context.js --check

  test:
    name: Validate Changes
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) &&
      github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/test.yml
    with:
      mode: ${{ github.event_name == 'merge_group' && 'full' || (vars.CI_MERGE_QUEUE_ENABLED == 'true' && 'affected' || 'full') }}
      checkout_ref: >-
        ${{ github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.sha || github.sha }}
    permissions:
      contents: read
      packages: read

  docs-build:
    name: Validate Documentation Build
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: arc-happyvertical

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Get changed files
        id: changed-files
        if: github.event_name == 'pull_request_target'
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c # v45
        with:
          files: |
            docs/**
            packages/*/README.md
            packages/*/AGENT.md
            packages/*/metadata.json
            ecosystem-manifest.json

      - name: Setup Environment
        if: github.event_name == 'merge_group' || steps.changed-files.outputs.any_changed == 'true'
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          github-packages-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build documentation site
        id: build
        if: github.event_name == 'merge_group' || steps.changed-files.outputs.any_changed == 'true'
        run: pnpm run docs:site:build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Documentation build summary
        if: github.event_name == 'merge_group' || steps.changed-files.outputs.any_changed == 'true'
        run: |
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "::warning::Documentation build failed (pre-existing Docusaurus SSR issue). This does not block the PR."
          else
            echo "Documentation site built successfully with no broken links."
          fi

  secret-scan:
    name: Secret Scan
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: arc-happyvertical
    steps:
      - name: Checkout PR history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Install Gitleaks CLI
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          mkdir -p "$RUNNER_TEMP/bin"
          install "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/bin/gitleaks"
      - name: Scan introduced commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/bin/gitleaks" git --no-banner --redact \
            --log-opts="$BASE_SHA..$HEAD_SHA" .

  postgres-scope:
    name: Detect PostgreSQL Test Scope
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: arc-happyvertical
    outputs:
      required: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.postgres }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Detect PostgreSQL-sensitive changes
        id: filter
        if: github.event_name == 'pull_request_target'
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          filters: |
            postgres:
              - '.github/actions/**'
              - '.github/workflows/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'vite.config.base.*'
              - 'vitest.config.*'
              - 'vitest.package.config.*'
              - 'vitest.shared.*'
              - 'vitest.setup.*'
              - 'packages/sql/**'
              - 'packages/utils/**'
              - 'scripts/run-with-ci-postgres.mjs'

  postgres-tests:
    name: PostgreSQL Tests
    needs: postgres-scope
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) &&
      github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/postgres-tests.yml
    with:
      checkout_ref: >-
        ${{ github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.sha || github.sha }}
    permissions:
      contents: read
      packages: read

  publish-dry-run:
    name: Publish Dry Run
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) &&
      github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/publish-dry-run.yml
    with:
      checkout_ref: >-
        ${{ github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.sha || github.sha }}
    permissions:
      contents: read
      packages: read

  required-ci:
    name: Required CI
    if: >-
      always() && (github.event_name == 'merge_group' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    needs: [changeset-check, validate-commits, validate-workflows, check-naming, doc-coverage, test, docs-build, secret-scan, postgres-scope, postgres-tests, publish-dry-run]
    runs-on: arc-happyvertical
    timeout-minutes: 5
    steps:
      - name: Require full validation success
        env:
          CHANGESET_CHECK: ${{ needs.changeset-check.result }}
          VALIDATE_COMMITS: ${{ needs.validate-commits.result }}
          VALIDATE_WORKFLOWS: ${{ needs.validate-workflows.result }}
          CHECK_NAMING: ${{ needs.check-naming.result }}
          DOC_COVERAGE: ${{ needs.doc-coverage.result }}
          TEST: ${{ needs.test.result }}
          DOCS_BUILD: ${{ needs.docs-build.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          POSTGRES_SCOPE: ${{ needs.postgres-scope.result }}
          POSTGRES_SCOPE_RESULT: ${{ needs.postgres-scope.result }}
          POSTGRES_REQUIRED: ${{ needs.postgres-scope.outputs.required }}
          POSTGRES_ENABLED: ${{ vars.CI_POSTGRES_ENABLED }}
          POSTGRES_TESTS: ${{ needs.postgres-tests.result }}
          PUBLISH_DRY_RUN: ${{ needs.publish-dry-run.result }}
        run: |
          set -euo pipefail
          # The reusable PostgreSQL workflow scopes its suites internally; a
          # skipped run is a pass only when scope detection says the change
          # does not require them.
          if [ "$POSTGRES_TESTS" != success ]; then
            if { [ "$POSTGRES_REQUIRED" = "true" ] && [ "$POSTGRES_ENABLED" = "true" ]; } || [ "$POSTGRES_TESTS" != skipped ]; then
              echo "::error::PostgreSQL validation did not succeed: required=$POSTGRES_REQUIRED result=$POSTGRES_TESTS"
              exit 1
            fi
          fi
          for result in "$CHANGESET_CHECK" "$VALIDATE_COMMITS" "$VALIDATE_WORKFLOWS" "$CHECK_NAMING" "$DOC_COVERAGE" "$TEST" "$DOCS_BUILD" "$SECRET_SCAN" "$POSTGRES_SCOPE" "$PUBLISH_DRY_RUN"; do
            if [ "$result" != success ]; then
              echo "::error::full validation did not succeed: changeset-check=$CHANGESET_CHECK validate-commits=$VALIDATE_COMMITS validate-workflows=$VALIDATE_WORKFLOWS check-naming=$CHECK_NAMING doc-coverage=$DOC_COVERAGE test=$TEST docs-build=$DOCS_BUILD secret-scan=$SECRET_SCAN postgres-scope=$POSTGRES_SCOPE postgres-tests=$POSTGRES_TESTS publish-dry-run=$PUBLISH_DRY_RUN"
              exit 1
            fi
          done
