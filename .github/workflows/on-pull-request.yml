name: Pull Request Validation

on:
  pull_request:
    branches: [main, dependency-updates]

# Cancel superseded runs when new commits are pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  packages: read

jobs:
  changeset-check:
    name: Check for Changeset
    runs-on: arc-happyvertical
    if: |
      !startsWith(github.event.pull_request.head.ref, 'renovate/')

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Check for skip conditions
        id: skip-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          if gh pr view "$PR_NUM" --json labels \
             --jq '.labels[].name' | grep -q 'skip-changeset'; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✅ Will skip (skip-changeset label present)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Environment
        if: steps.skip-check.outputs.skip != 'true'
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'
          install-deps: 'true'

      - name: Check for changeset
        if: steps.skip-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          if gh pr view "$PR_NUM" --json labels \
             --jq '.labels[].name' | grep -q 'skip-changeset'; then
            echo "✅ Skipping changeset check (skip-changeset label present)"
            exit 0
          fi

          PR_BRANCH="${{ github.event.pull_request.head.ref }}"
          if echo "$PR_BRANCH" | grep -q '^renovate/'; then
            echo "✅ Skipping changeset check (Renovate dependency update PR from $PR_BRANCH)"
            exit 0
          fi

          echo ""
          echo "🔍 Checking for conventional commits..."

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          RELEASEABLE_COMMITS=$(git log \
            $BASE_SHA..$HEAD_SHA --pretty=format:"%s" --no-merges | \
            grep -E '^(feat|fix|perf)(\(.+\))?!?:|^chore\(deps\)!?:|BREAKING CHANGE' \
            || true)

          if [ -n "$RELEASEABLE_COMMITS" ]; then
            echo "✅ Found conventional commits that will trigger auto-changeset on merge:"
            echo "$RELEASEABLE_COMMITS"
            echo ""
            echo "🔍 Validating changeset:auto script can generate changesets..."

            if pnpm run changeset:auto; then
              echo "✅ changeset:auto validation passed"
              echo ""
              echo "Generated changesets will be created automatically when this change reaches main."
              exit 0
            else
              echo "❌ ERROR: changeset:auto script failed"
              echo ""
              echo "The auto-changeset generation script encountered an error."
              echo "Please check the script or add a manual changeset."
              exit 1
            fi
          fi

          echo "ℹ️  No releaseable conventional commits found"
          echo "(feat, fix, perf, chore(deps), or breaking changes)"
          echo ""

          changeset_count=$(find .changeset -name '*.md' \
            ! -name 'README.md' 2>/dev/null | wc -l)

          if [ "$changeset_count" -eq 0 ]; then
            echo "✅ No explicit changeset required for this PR"
            echo ""
            echo "This PR can merge without a version bump until its changes reach main,"
            echo "where non-merge commits (including squash/rebase commits) are"
            echo "evaluated by the on-main auto changeset rules."
            exit 0
          fi

          echo "✅ Found $changeset_count changeset(s)"
          find .changeset -name '*.md' ! -name 'README.md' -exec basename {} \;

          echo ""
          echo "🔍 Validating changeset types..."

          if find .changeset -name '*.md' ! -name 'README.md' \
             -type f -exec grep -l '"major"' {} + 2>/dev/null | \
             grep -q .; then
            echo "❌ ERROR: Major version bump detected in changeset!"
            echo ""
            echo "Files with major bumps:"
            find .changeset -name '*.md' ! -name 'README.md' \
              -type f -exec grep -l '"major"' {} + 2>/dev/null || true
            echo ""
            echo "Major version releases (1.0.0+) must be manually approved and coordinated."
            echo "Please change the version bump type to 'minor' or 'patch'."
            echo ""
            echo "If you truly need a major version bump, coordinate with maintainers first."
            exit 1
          fi

          echo "✅ No major version bumps detected"

  validate-commits:
    name: Validate Conventional Commits
    runs-on: arc-happyvertical

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        with:
          configFile: commitlint.config.mjs

      # PR title validation only needs commitlint, not the full
      # workspace setup. Avoid ./.github/actions/setup-environment here
      # because that composite action installs apt packages and the
      # complete workspace dependency graph on the self-hosted runner.
      - name: Setup Node.js for PR title validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Setup pnpm for PR title validation
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6
        with:
          run_install: false

      - name: Install commitlint dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @happyvertical/sdk
        env:
          # Needed only because .npmrc references GitHub Packages auth.
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Validate PR title for squash merge
        # PR title is user-controlled metadata. Two non-obvious risks
        # the previous form had:
        #   (1) Interpolating the title directly into a shell script
        #       lets a title with command substitution execute the
        #       substitution at the runner's shell — real command
        #       injection, especially on the self-hosted
        #       arc-happyvertical runner this workflow runs on. Pass
        #       via env: instead, then quote the variable expansion.
        #   (2) scripts/validate-conventional-commits.js uses a
        #       hardcoded regex with permissive scope and a 50-char
        #       subject limit. Titles that pass the commit-validate
        #       job's commitlint config (with strict scope-enum +
        #       100-char limit) could STILL be rejected here, AND
        #       titles that fail commitlint's scope-enum could
        #       squash-merge cleanly. Replace the regex check with
        #       commitlint using the same config the commit
        #       validator uses, so both gates speak with one voice.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # printf instead of echo: avoids the leading-dash flag trap
          # (a title starting with -e/-n/-E would be eaten by echo).
          # pnpm exec finds commitlint from the root-only install above;
          # that avoids apt packages, workspace install scripts, and
          # package-level dependency installation.
          printf 'Validating PR title (length=%s)\n' "${#PR_TITLE}"
          printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --config commitlint.config.mjs

      - name: Determine version bump
        id: version
        run: |
          base_ref="${{ github.event.pull_request.base.ref }}"
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          commits=$(git log "$base_sha..$head_sha" --no-merges --pretty=format:"%s")

          bump="patch"
          if echo "$commits" | grep -qE "^feat(\(.+\))?!?:"; then
            bump="minor"
          fi

          if echo "$commits" | grep -qiE "(BREAKING CHANGE|!:)"; then
            bump="minor"  # Treat as minor until 1.0.0
          fi

          echo "base_ref=$base_ref" >> $GITHUB_OUTPUT
          echo "bump=$bump" >> $GITHUB_OUTPUT
          if [ "$base_ref" = "main" ]; then
            echo "📦 Merging to main will perform a $bump version bump"
          else
            echo "📦 This PR contributes a $bump release signal when $base_ref later reaches main"
          fi

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const bump = '${{ steps.version.outputs.bump }}';
            const baseRef = '${{ steps.version.outputs.base_ref }}';
            const directToMain = baseRef === 'main';
            const intro = directToMain
              ? `When this PR is merged into \`main\`, packages will receive a **${bump}** version bump based on your conventional commits.`
              : `When this PR is merged into \`${baseRef}\`, it will contribute a **${bump}** release signal. Packages are versioned and published later, when \`${baseRef}\` is merged into \`main\`.`;
            const steps = directToMain
              ? [
                  '1. Tests run on the main branch',
                  '2. Packages are built',
                  '3. Versions are bumped automatically',
                  '4. The release commit is pushed back to `main`',
                  '5. Packages are published to public npm',
                  '6. Git tags are created'
                ]
              : [
                  '1. Tests run on the integration branch',
                  `2. This change accumulates on \`${baseRef}\``,
                  `3. When \`${baseRef}\` is later merged into \`main\`, release automation versions and publishes the accumulated dependency updates`
                ];

            const comment = [
              '## 📦 Version Bump Preview',
              '',
              intro,
              '',
              '### What happens on merge?',
              '',
              ...steps
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existingComment = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Version Bump Preview')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

  validate-workflows:
    name: Validate Workflow Files
    runs-on: arc-happyvertical

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Get changed workflow files
        id: changed-files
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c # v45
        with:
          files: .github/workflows/*.{yml,yaml}

      - name: Validate workflow syntax
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "🔍 Validating workflow files..."
          files="${{ steps.changed-files.outputs.all_changed_files }}"
          echo "Changed files: $files"

          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "  Checking $file..."
            yamllint -c .github/.yamllint.yml "$file" || exit 1
          done

          echo "✅ YAML syntax validation passed"

      - name: Install act
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          mkdir -p bin
          curl --proto '=https' --tlsv1.2 -sSfL \
            https://raw.githubusercontent.com/nektos/act/master/install.sh \
            | sudo bash -s -- -b bin v0.2.88

      - name: Validate with act
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          if ! ./bin/act --list > /tmp/act-output.txt 2>&1; then
            echo "❌ act --list failed - workflow syntax issue"
            echo "Error output:"
            cat /tmp/act-output.txt
            exit 1
          fi
          echo "✅ act validation passed"

      - name: Workflow validation summary
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "✅ All workflow validations passed:"
          echo "  - YAML syntax validated with yamllint"
          echo "  - Workflow parsing verified with act"

  check-naming:
    name: Check for stale @have/ references
    runs-on: arc-happyvertical

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Get changed markdown files
        id: changed-md
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c # v45
        with:
          files: '**/*.md'

      - name: Check for @have/ naming regressions in changed files
        if: steps.changed-md.outputs.any_changed == 'true'
        run: |
          echo "Checking changed markdown files for stale @have/ references..."

          found=false
          for file in ${{ steps.changed-md.outputs.all_changed_files }}; do
            if grep -n '@have/' "$file" 2>/dev/null; then
              echo "::error file=$file::Found stale @have/ reference. Should be @happyvertical/."
              found=true
            fi
          done

          if [ "$found" = true ]; then
            exit 1
          fi

          echo "No stale @have/ references found in changed files."

  doc-coverage:
    name: Check documentation coverage
    runs-on: arc-happyvertical

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c # v45
        with:
          files: |
            packages/*/src/**

      - name: Check doc coverage for changed packages
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Checking documentation coverage for changed packages..."

          packages=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" | \
            tr ' ' '\n' | \
            sed -n 's|.*packages/\([^/]*\)/.*|\1|p' | \
            sort -u)

          missing=false
          for pkg in $packages; do
            echo "Checking package: $pkg"

            if [ ! -f "packages/$pkg/README.md" ]; then
              echo "::warning file=packages/$pkg::Missing packages/$pkg/README.md"
              missing=true
            fi

            if [ ! -f "packages/$pkg/AGENT.md" ]; then
              echo "::warning file=packages/$pkg::Missing packages/$pkg/AGENT.md"
              missing=true
            fi

            if [ ! -f "packages/$pkg/metadata.json" ]; then
              echo "::warning file=packages/$pkg::Missing packages/$pkg/metadata.json"
              missing=true
            fi
          done

          if [ "$missing" = false ]; then
            echo "All changed packages have README.md, AGENT.md, and metadata.json files."
          fi

      - name: Check ecosystem manifest freshness
        if: steps.changed-files.outputs.any_changed == 'true'
        run: pnpm run agent:check

  test:
    name: Validate Changes
    uses: ./.github/workflows/test.yml

  docs-build:
    name: Validate Documentation Build
    runs-on: arc-happyvertical

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c # v45
        with:
          files: |
            docs/**
            packages/*/README.md
            packages/*/AGENT.md
            packages/*/metadata.json
            ecosystem-manifest.json

      - name: Setup Environment
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'

      - name: Build documentation site
        id: build
        if: steps.changed-files.outputs.any_changed == 'true'
        run: pnpm run docs:site:build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Documentation build summary
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "::warning::Documentation build failed (pre-existing Docusaurus SSR issue). This does not block the PR."
          else
            echo "Documentation site built successfully with no broken links."
          fi

  dependabot:
    name: Dependabot Automation
    runs-on: arc-happyvertical
    needs: [test]
    if: |
      github.actor == 'dependabot[bot]' &&
      needs.test.outputs.success == 'true'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate security requirements
        run: |
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "::error::GITHUB_TOKEN is not available"
            exit 1
          fi
          echo "✅ Security requirements validated"
          echo "::notice::Processing dependabot PR with enhanced security checks"

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Security scan for dependency changes
        run: |
          echo "::notice::Checking for security vulnerabilities in dependencies"
          echo "Dependency update type: ${{ steps.metadata.outputs.update-type }}"
          echo "Package ecosystem: ${{ steps.metadata.outputs.package-ecosystem }}"
          echo "Package name: ${{ steps.metadata.outputs.dependency-names }}"
          pnpm audit || {
            echo "::error::Security vulnerabilities found in dependencies"
            exit 1
          }
          echo "✅ No security vulnerabilities detected"

      - name: Approve PR with security validation
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        run: |
          echo "::notice::Approving dependabot PR after security validation"
          gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for minor and patch updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          echo "::notice::Enabling auto-merge for ${{ steps.metadata.outputs.update-type }} update"
          gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Require manual review for major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "Major version update detected. Manual review required."
          echo "This PR will not be automatically approved or merged."
          gh pr comment "$PR_URL" \
            --body "Major version update detected. Manual review required."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
