name: Pull Request Validation

on:
  pull_request:
    branches: [main, dependency-updates]
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to recheck after a claim-only transition
        required: true
        type: number

# Cancel superseded runs when new commits are pushed.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number ||
      inputs.pr_number ||
      github.event.merge_group.head_sha ||
      github.ref
    }}-${{
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      !contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) &&
      !(github.event.action == 'edited' && github.event.changes.base != null))) &&
      'lifecycle' ||
      'validation'
    }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  packages: read

jobs:
  # hv-agent-policy:start
  lifecycle:
    name: lifecycle
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      packages: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
      - name: Load pinned policy runtime
        env:
          POLICY_ARTIFACT: ${{ vars.AGENT_POLICY_ARTIFACT }}
        run: |
          case "$POLICY_ARTIFACT" in
            ghcr.io/*@sha256:*) ;;
            *) echo 'AGENT_POLICY_ARTIFACT must be an immutable GHCR digest' >&2; exit 1 ;;
          esac
          policy_dir="$RUNNER_TEMP/hv-policy"
          rm -rf "$policy_dir"
          mkdir -p "$policy_dir"
          oras pull "$POLICY_ARTIFACT" -o "$policy_dir"
          archive="$policy_dir/agent-policy.tar.gz"
          test -f "$archive" || { echo 'policy artifact is missing agent-policy.tar.gz' >&2; exit 1; }
          python3 - "$archive" <<'PY'
          import pathlib
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], "r:gz") as archive:
              for member in archive.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f"unsafe policy archive member: {member.name}")
          PY
          tar -xzf "$archive" -C "$policy_dir"
          echo "HV_POLICY_DIR=$policy_dir" >> "$GITHUB_ENV"
      - name: Validate lifecycle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          numbers_file="$RUNNER_TEMP/hv-agent-lifecycle-prs"
          "$HV_POLICY_DIR/scripts/hv-agent-lifecycle-prs" > "$numbers_file"
          while IFS= read -r number; do
            python3 "$HV_POLICY_DIR/scripts/hv-agent" check-pr "$number"
          done < "$numbers_file"
  # hv-agent-policy:end

  changeset-check:
    name: Check for Changeset
    runs-on: ${{ vars.CI_NODE_RUNNER_ENABLED == 'true' && 'arc-happyvertical-node' || 'arc-happyvertical' }}
    if: |
      github.event_name == 'pull_request' &&
      (contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) ||
      (github.event.action == 'edited' && github.event.changes.base != null)) &&
      !startsWith(github.event.pull_request.head.ref, 'renovate/')

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Check for skip conditions
        id: skip-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          if gh pr view "$PR_NUM" --json labels \
             --jq '.labels[].name' | grep -q 'skip-changeset'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ Will skip (skip-changeset label present)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Environment
        if: steps.skip-check.outputs.skip != 'true'
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          install-deps: 'true'
          github-packages-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changeset
        if: steps.skip-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          if gh pr view "$PR_NUM" --json labels \
             --jq '.labels[].name' | grep -q 'skip-changeset'; then
            echo "✅ Skipping changeset check (skip-changeset label present)"
            exit 0
          fi

          if echo "$PR_BRANCH" | grep -q '^renovate/'; then
            echo "✅ Skipping changeset check (Renovate dependency update PR from $PR_BRANCH)"
            exit 0
          fi

          echo ""
          echo "🔍 Checking for conventional commits..."

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          RELEASEABLE_COMMITS=$(git log \
            $BASE_SHA..$HEAD_SHA --pretty=format:"%s" --no-merges | \
            grep -E '^(feat|fix|perf)(\(.+\))?!?:|^chore\(deps\)!?:|BREAKING CHANGE' \
            || true)

          if [ -n "$RELEASEABLE_COMMITS" ]; then
            echo "✅ Found conventional commits that will trigger auto-changeset on merge:"
            echo "$RELEASEABLE_COMMITS"
            echo ""
            echo "🔍 Validating changeset:auto script can generate changesets..."

            if pnpm run changeset:auto; then
              echo "✅ changeset:auto validation passed"
              echo ""
              echo "Generated changesets will be created automatically when this change reaches main."
              exit 0
            else
              echo "❌ ERROR: changeset:auto script failed"
              echo ""
              echo "The auto-changeset generation script encountered an error."
              echo "Please check the script or add a manual changeset."
              exit 1
            fi
          fi

          echo "ℹ️  No releaseable conventional commits found"
          echo "(feat, fix, perf, chore(deps), or breaking changes)"
          echo ""

          changeset_count=$(find .changeset -name '*.md' \
            ! -name 'README.md' 2>/dev/null | wc -l)

          if [ "$changeset_count" -eq 0 ]; then
            echo "✅ No explicit changeset required for this PR"
            echo ""
            echo "This PR can merge without a version bump until its changes reach main,"
            echo "where non-merge commits (including squash/rebase commits) are"
            echo "evaluated by the on-main auto changeset rules."
            exit 0
          fi

          echo "✅ Found $changeset_count changeset(s)"
          find .changeset -name '*.md' ! -name 'README.md' -exec basename {} \;

          echo ""
          echo "🔍 Validating changeset types..."

          if find .changeset -name '*.md' ! -name 'README.md' \
             -type f -exec grep -l '"major"' {} + 2>/dev/null | \
             grep -q .; then
            echo "❌ ERROR: Major version bump detected in changeset!"
            echo ""
            echo "Files with major bumps:"
            find .changeset -name '*.md' ! -name 'README.md' \
              -type f -exec grep -l '"major"' {} + 2>/dev/null || true
            echo ""
            echo "Major version releases (1.0.0+) must be manually approved and coordinated."
            echo "Please change the version bump type to 'minor' or 'patch'."
            echo ""
            echo "If you truly need a major version bump, coordinate with maintainers first."
            exit 1
          fi

          echo "✅ No major version bumps detected"

  validate-commits:
    name: Validate Conventional Commits
    if: >-
      github.event_name == 'pull_request' &&
      (contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) ||
      (github.event.action == 'edited' && github.event.changes.base != null))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      packages: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        with:
          configFile: commitlint.config.mjs

      # PR title validation only needs commitlint, not the full
      # workspace setup. Avoid ./.github/actions/setup-environment here
      # because that composite action installs apt packages and the
      # complete workspace dependency graph on the self-hosted runner.
      - name: Setup Node.js for PR title validation
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.18.0'

      - name: Install commitlint dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/commitlint" --no-save \
            --ignore-scripts --no-audit --no-fund \
            @commitlint/cli@20.5.0 \
            @commitlint/config-conventional@20.5.0

      - name: Validate PR title for squash merge
        # PR title is user-controlled metadata. Two non-obvious risks
        # the previous form had:
        #   (1) Interpolating the title directly into a shell script
        #       lets a title with command substitution execute the
        #       substitution at the runner's shell — real command
        #       injection, especially on the self-hosted
        #       arc-happyvertical runner this workflow runs on. Pass
        #       via env: instead, then quote the variable expansion.
        #   (2) scripts/validate-conventional-commits.js uses a
        #       hardcoded regex with permissive scope and a 50-char
        #       subject limit. Titles that pass the commit-validate
        #       job's commitlint config (with strict scope-enum +
        #       100-char limit) could STILL be rejected here, AND
        #       titles that fail commitlint's scope-enum could
        #       squash-merge cleanly. Replace the regex check with
        #       commitlint using the same config the commit
        #       validator uses, so both gates speak with one voice.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # printf instead of echo: avoids the leading-dash flag trap
          # (a title starting with -e/-n/-E would be eaten by echo).
          # NODE_PATH lets the repository config resolve its conventional
          # preset from the standalone temp install. No workspace package or
          # private registry dependency is installed by this metadata job.
          printf 'Validating PR title (length=%s)\n' "${#PR_TITLE}"
          printf '%s\n' "$PR_TITLE" | \
            NODE_PATH="$RUNNER_TEMP/commitlint/node_modules" \
            "$RUNNER_TEMP/commitlint/node_modules/.bin/commitlint" \
              --config commitlint.config.mjs

      - name: Determine version bump
        id: version
        run: |
          base_ref="${{ github.event.pull_request.base.ref }}"
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          commits=$(git log "$base_sha..$head_sha" --no-merges --pretty=format:"%s")

          bump="patch"
          if echo "$commits" | grep -qE "^feat(\(.+\))?!?:"; then
            bump="minor"
          fi

          if echo "$commits" | grep -qiE "(BREAKING CHANGE|!:)"; then
            bump="minor"  # Treat as minor until 1.0.0
          fi

          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          if [ "$base_ref" = "main" ]; then
            echo "📦 Merging to main will perform a $bump version bump"
          else
            echo "📦 This PR contributes a $bump release signal when $base_ref later reaches main"
          fi

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const bump = '${{ steps.version.outputs.bump }}';
            const baseRef = '${{ steps.version.outputs.base_ref }}';
            const directToMain = baseRef === 'main';
            const intro = directToMain
              ? `When this PR is merged into \`main\`, packages will receive a **${bump}** version bump based on your conventional commits.`
              : `When this PR is merged into \`${baseRef}\`, it will contribute a **${bump}** release signal. Packages are versioned and published later, when \`${baseRef}\` is merged into \`main\`.`;
            const steps = directToMain
              ? [
                  '1. Tests run on the main branch',
                  '2. Packages are built',
                  '3. Versions are bumped automatically',
                  '4. The release commit is pushed back to `main`',
                  '5. Packages are published to public npm',
                  '6. Git tags are created'
                ]
              : [
                  '1. Tests run on the integration branch',
                  `2. This change accumulates on \`${baseRef}\``,
                  `3. When \`${baseRef}\` is later merged into \`main\`, release automation versions and publishes the accumulated dependency updates`
                ];

            const comment = [
              '## 📦 Version Bump Preview',
              '',
              intro,
              '',
              '### What happens on merge?',
              '',
              ...steps
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existingComment = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Version Bump Preview')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

  validate-workflows:
    name: Validate Workflow Files
    if: >-
      github.event_name == 'pull_request' &&
      (contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) ||
      (github.event.action == 'edited' && github.event.changes.base != null))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Get changed workflow files
        id: changed-files
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c # v45
        with:
          files: .github/workflows/*.{yml,yaml}

      - name: Validate workflow syntax
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "🔍 Validating workflow files..."
          files="${{ steps.changed-files.outputs.all_changed_files }}"
          echo "Changed files: $files"

          python3 -m pip install --user yamllint

          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "  Checking $file..."
            "$HOME/.local/bin/yamllint" -c .github/.yamllint.yml "$file" || exit 1
          done

          echo "✅ YAML syntax validation passed"

      - name: Validate with actionlint
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          bash <(curl -sSfL \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            ./actionlint -config-file .github/actionlint.yaml \
              -ignore 'SC2086|SC2094|SC2129' "$file"
          done

      - name: Workflow validation summary
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "✅ All workflow validations passed:"
          echo "  - YAML syntax validated with yamllint"
          echo "  - Workflow expressions validated with actionlint"

  check-naming:
    name: Check for stale @have/ references
    if: >-
      github.event_name == 'pull_request' &&
      (contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) ||
      (github.event.action == 'edited' && github.event.changes.base != null))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Get changed markdown files
        id: changed-md
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c # v45
        with:
          files: '**/*.md'

      - name: Check for @have/ naming regressions in changed files
        if: steps.changed-md.outputs.any_changed == 'true'
        run: |
          echo "Checking changed markdown files for stale @have/ references..."

          found=false
          for file in ${{ steps.changed-md.outputs.all_changed_files }}; do
            if grep -n '@have/' "$file" 2>/dev/null; then
              echo "::error file=$file::Found stale @have/ reference. Should be @happyvertical/."
              found=true
            fi
          done

          if [ "$found" = true ]; then
            exit 1
          fi

          echo "No stale @have/ references found in changed files."

  doc-coverage:
    name: Check documentation coverage
    if: >-
      github.event_name == 'pull_request' &&
      (contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) ||
      (github.event.action == 'edited' && github.event.changes.base != null))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c # v45
        with:
          files: |
            packages/*/src/**

      - name: Check doc coverage for changed packages
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Checking documentation coverage for changed packages..."

          packages=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" | \
            tr ' ' '\n' | \
            sed -n 's|.*packages/\([^/]*\)/.*|\1|p' | \
            sort -u)

          missing=false
          for pkg in $packages; do
            echo "Checking package: $pkg"

            if [ ! -f "packages/$pkg/README.md" ]; then
              echo "::warning file=packages/$pkg::Missing packages/$pkg/README.md"
              missing=true
            fi

            if [ ! -f "packages/$pkg/AGENT.md" ]; then
              echo "::warning file=packages/$pkg::Missing packages/$pkg/AGENT.md"
              missing=true
            fi

            if [ ! -f "packages/$pkg/metadata.json" ]; then
              echo "::warning file=packages/$pkg::Missing packages/$pkg/metadata.json"
              missing=true
            fi
          done

          if [ "$missing" = false ]; then
            echo "All changed packages have README.md, AGENT.md, and metadata.json files."
          fi

      - name: Check ecosystem manifest freshness
        if: steps.changed-files.outputs.any_changed == 'true'
        run: node scripts/sync-agent-context.js --check

  test:
    name: Validate Changes
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' &&
      (contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) ||
      (github.event.action == 'edited' && github.event.changes.base != null)))
    uses: ./.github/workflows/test.yml
    with:
      mode: ${{ github.event_name == 'merge_group' && 'full' || (vars.CI_MERGE_QUEUE_ENABLED == 'true' && 'affected' || 'full') }}
    permissions:
      contents: read
      packages: read

  docs-build:
    name: Validate Documentation Build
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' &&
      (contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) ||
      (github.event.action == 'edited' && github.event.changes.base != null)))
    runs-on: ${{ vars.CI_NODE_RUNNER_ENABLED == 'true' && 'arc-happyvertical-node' || 'arc-happyvertical' }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Get changed files
        id: changed-files
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c # v45
        with:
          files: |
            docs/**
            packages/*/README.md
            packages/*/AGENT.md
            packages/*/metadata.json
            ecosystem-manifest.json

      - name: Setup Environment
        if: github.event_name == 'merge_group' || steps.changed-files.outputs.any_changed == 'true'
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          github-packages-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build documentation site
        id: build
        if: github.event_name == 'merge_group' || steps.changed-files.outputs.any_changed == 'true'
        run: pnpm run docs:site:build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Documentation build summary
        if: github.event_name == 'merge_group' || steps.changed-files.outputs.any_changed == 'true'
        run: |
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "::warning::Documentation build failed (pre-existing Docusaurus SSR issue). This does not block the PR."
          else
            echo "Documentation site built successfully with no broken links."
          fi

  secret-scan:
    name: Secret Scan
    if: >-
      github.event_name == 'pull_request' &&
      (contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) ||
      (github.event.action == 'edited' && github.event.changes.base != null))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks CLI
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          mkdir -p "$RUNNER_TEMP/bin"
          install "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/bin/gitleaks"
      - name: Scan introduced commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/bin/gitleaks" git --no-banner --redact \
            --log-opts="$BASE_SHA..$HEAD_SHA" .

  postgres-scope:
    name: Detect PostgreSQL Test Scope
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' &&
      (contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) ||
      (github.event.action == 'edited' && github.event.changes.base != null)))
    runs-on: ubuntu-latest
    outputs:
      required: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.postgres }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Detect PostgreSQL-sensitive changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          filters: |
            postgres:
              - '.github/actions/**'
              - '.github/workflows/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'vitest.config.*'
              - 'packages/sql/**'
              - 'packages/utils/**'
              - 'scripts/run-with-ci-postgres.mjs'

  postgres-tests:
    name: PostgreSQL Tests
    needs: postgres-scope
    if: >-
      (github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' &&
      (contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) ||
      (github.event.action == 'edited' && github.event.changes.base != null)))) &&
      needs.postgres-scope.outputs.required == 'true' &&
      vars.CI_POSTGRES_ENABLED == 'true'
    uses: ./.github/workflows/postgres-tests.yml
    permissions:
      contents: read
      packages: read

  publish-dry-run:
    name: Publish Dry Run
    if: >-
      (github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' &&
      (contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) ||
      (github.event.action == 'edited' && github.event.changes.base != null)))) &&
      (github.event_name == 'merge_group' || vars.CI_MERGE_QUEUE_ENABLED != 'true')
    uses: ./.github/workflows/publish-dry-run.yml
    permissions:
      contents: read
      packages: read

  required-ci:
    name: Required CI
    if: always()
    needs:
      - lifecycle
      - changeset-check
      - validate-commits
      - validate-workflows
      - check-naming
      - doc-coverage
      - secret-scan
      - postgres-scope
      - postgres-tests
      - test
      - docs-build
      - publish-dry-run
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Verify event-appropriate required job set
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_CHANGED: ${{ github.event.changes.base != null }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.head_ref }}
          MERGE_QUEUE_ENABLED: ${{ vars.CI_MERGE_QUEUE_ENABLED }}
          LIFECYCLE: ${{ needs.lifecycle.result }}
          CHANGESET: ${{ needs.changeset-check.result }}
          COMMITS: ${{ needs.validate-commits.result }}
          WORKFLOWS: ${{ needs.validate-workflows.result }}
          NAMING: ${{ needs.check-naming.result }}
          DOC_COVERAGE: ${{ needs.doc-coverage.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          POSTGRES_SCOPE: ${{ needs.postgres-scope.result }}
          POSTGRES_REQUIRED: ${{ needs.postgres-scope.outputs.required }}
          POSTGRES_ENABLED: ${{ vars.CI_POSTGRES_ENABLED }}
          POSTGRES: ${{ needs.postgres-tests.result }}
          TEST: ${{ needs.test.result }}
          DOCS: ${{ needs.docs-build.result }}
          PACK: ${{ needs.publish-dry-run.result }}
        run: |
          set -euo pipefail
          require_success() {
            if [ "$2" != success ]; then
              echo "$1 must succeed, got: $2"
              exit 1
            fi
          }

          require_success 'Lifecycle policy' "$LIFECYCLE"

          full_validation=false
          if [ "$EVENT_NAME" = merge_group ]; then
            full_validation=true
          elif [ "$EVENT_NAME" = pull_request ] && {
            [[ "$EVENT_ACTION" =~ ^(opened|synchronize|reopened)$ ]] ||
              { [ "$EVENT_ACTION" = edited ] && [ "$BASE_CHANGED" = true ]; }
          }; then
            full_validation=true
          fi

          if [ "$full_validation" = false ]; then
            head_sha="$EVENT_HEAD_SHA"
            if [ "$EVENT_NAME" = workflow_dispatch ]; then
              head_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
            fi
            checks=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs?check_name=Required%20CI&filter=all&per_page=100")
            other_pending=$(printf '%s\n' "$checks" | jq --arg current_run "/actions/runs/$GITHUB_RUN_ID/" \
              '[.check_runs[] | select(.name == "Required CI" and .status != "completed") | select(((.details_url // "") | contains($current_run)) | not)] | length')
            if [ "$other_pending" -gt 0 ]; then
              echo "::error::Another Required CI is still running for $head_sha"
              exit 1
            fi
            latest=$(printf '%s\n' "$checks" | jq -r \
              '[.check_runs[] | select(.name == "Required CI" and .status == "completed" and .conclusion != "cancelled")] | sort_by(.completed_at) | reverse | .[0].conclusion // "missing"')
            if [ "$latest" != success ]; then
              echo "::error::Latest completed Required CI for $head_sha must pass, got: $latest"
              exit 1
            fi
            echo "Preserved the latest successful Required CI for $head_sha after lifecycle-only event."
            exit 0
          fi

          require_success 'PostgreSQL scope detection' "$POSTGRES_SCOPE"
          require_success 'Validate Changes' "$TEST"
          require_success 'Documentation Build' "$DOCS"

          if [ "$POSTGRES_REQUIRED" = true ] && [ "$POSTGRES_ENABLED" = true ]; then
            require_success 'PostgreSQL Tests' "$POSTGRES"
          elif [ "$POSTGRES" != skipped ]; then
            echo "PostgreSQL Tests should be skipped, got: $POSTGRES"
            exit 1
          fi

          if [ "$EVENT_NAME" = pull_request ]; then
            if [[ "$HEAD_REF" == renovate/* ]]; then
              test "$CHANGESET" = skipped
            else
              require_success 'Changeset Check' "$CHANGESET"
            fi
            require_success 'Conventional Commits' "$COMMITS"
            require_success 'Workflow Validation' "$WORKFLOWS"
            require_success 'Naming Check' "$NAMING"
            require_success 'Documentation Coverage' "$DOC_COVERAGE"
            require_success 'Secret Scan' "$SECRET_SCAN"
            if [ "$MERGE_QUEUE_ENABLED" = true ]; then
              test "$PACK" = skipped
            else
              require_success 'Publish Dry Run' "$PACK"
            fi
          else
            for result in "$CHANGESET" "$COMMITS" "$WORKFLOWS" "$NAMING" "$DOC_COVERAGE" "$SECRET_SCAN"; do
              test "$result" = skipped
            done
            require_success 'Publish Dry Run' "$PACK"
          fi

          echo "Required CI passed for $EVENT_NAME"

  dependabot:
    name: Dependabot Automation
    runs-on: ${{ vars.CI_NODE_RUNNER_ENABLED == 'true' && 'arc-happyvertical-node' || 'arc-happyvertical' }}
    needs: [test]
    if: |
      github.actor == 'dependabot[bot]' &&
      needs.test.outputs.success == 'true'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate security requirements
        run: |
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "::error::GITHUB_TOKEN is not available"
            exit 1
          fi
          echo "✅ Security requirements validated"
          echo "::notice::Processing dependabot PR with enhanced security checks"

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          github-packages-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Security scan for dependency changes
        run: |
          echo "::notice::Checking for security vulnerabilities in dependencies"
          echo "Dependency update type: ${{ steps.metadata.outputs.update-type }}"
          echo "Package ecosystem: ${{ steps.metadata.outputs.package-ecosystem }}"
          echo "Package name: ${{ steps.metadata.outputs.dependency-names }}"
          pnpm audit || {
            echo "::error::Security vulnerabilities found in dependencies"
            exit 1
          }
          echo "✅ No security vulnerabilities detected"

      - name: Approve PR with security validation
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        run: |
          echo "::notice::Approving dependabot PR after security validation"
          gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for minor and patch updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          echo "::notice::Enabling auto-merge for ${{ steps.metadata.outputs.update-type }} update"
          gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Require manual review for major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "Major version update detected. Manual review required."
          echo "This PR will not be automatically approved or merged."
          gh pr comment "$PR_URL" \
            --body "Major version update detected. Manual review required."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
