name: Test Suite

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner to use for tests'
        type: string
        required: false
        default: 'ubuntu-latest'

      node-version:
        description: 'Node.js version to use'
        type: string
        required: false
        default: '24'

    outputs:
      success:
        description: 'Whether tests passed'
        value: ${{ jobs.test.outputs.success }}

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ${{ inputs.runner }}

    # PostgreSQL service for database tests
    services:
      postgres:
        image: postgres:18-alpine@sha256:eca6fb2d91fda290eb8cfb8ba53dd0dcbf3508a08011e30adb039ea7c8e1e9f2
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
          PGUSER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    outputs:
      success: ${{ steps.test-result.outputs.success }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: |
          echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Get Playwright version
        id: playwright-version
        shell: bash
        run: |
          PLAYWRIGHT_VERSION=$(npm list playwright --depth=0 --json 2>/dev/null | grep -oP '"playwright":\s*{\s*"version":\s*"\K[^"]+' || echo "1.54.2")
          echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install system dependencies for ONNX Runtime
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libstdc++6 \
            libc6-dev \
            build-essential \
            gcc \
            g++ \
            cmake \
            libgomp1 \
            libprotobuf-dev

      - name: Install project dependencies
        shell: bash
        run: pnpm install --frozen-lockfile
        env:
          # Force ONNX Runtime to skip CUDA installation
          ONNXRUNTIME_NODE_INSTALL_CUDA: 'skip'

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: Setup Turborepo cache
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package.json', '**/pnpm-lock.yaml', 'packages/*/src/**', 'packages/*/test/**') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('**/package.json', '**/pnpm-lock.yaml', 'packages/*/src/**', 'packages/*/test/**') }}-
            ${{ runner.os }}-turbo-

      - name: Cache build outputs
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
        with:
          path: |
            packages/*/dist
            .turbo
          key: ${{ runner.os }}-build-${{ hashFiles('packages/*/src/**', 'packages/*/test/**', 'packages/*/package.json', 'packages/*/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Build packages
        run: pnpm run build

      - name: Run typecheck, lint, and tests in parallel
        id: parallel-checks
        run: |
          # Run typecheck, lint, and test in parallel using Turborepo
          pnpm turbo run typecheck lint test --parallel
        env:
          SQLOO_HOST: localhost
          SQLOO_USER: postgres
          SQLOO_PASSWORD: postgres
          SQLOO_DATABASE: testdb
          SQLOO_PORT: 5432

      - name: Set test result
        id: test-result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.parallel-checks.outcome }}" = "success" ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
