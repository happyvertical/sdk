# =============================================================================
# SHARED REUSABLE WORKFLOW - Direct Publish with semantic-release
# =============================================================================
# This is a reusable workflow that implements automated versioning and publishing
# using semantic-release based on conventional commits.
#
# Version bump rules:
# - Breaking changes (feat!, BREAKING CHANGE) → minor (0.x.0)
# - Features, fixes, perf → patch (0.0.x)
# - Other commits → no bump
#
# Usage in calling repository:
#   jobs:
#     release:
#       uses: happyvertical/sdk/.github/workflows/shared-direct-publish.yml@main
#       with:
#         node-version: '24'
#         registry-url: 'https://npm.pkg.github.com'
#       secrets:
#         GH_TOKEN: ${{ secrets.GH_TOKEN }}
# =============================================================================

name: Shared Direct Publish

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '24'
      registry-url:
        description: 'NPM registry URL'
        required: false
        type: string
        default: 'https://npm.pkg.github.com'
      skip-docs:
        description: 'Skip documentation deployment'
        required: false
        type: boolean
        default: false
    secrets:
      RELEASE_APP_ID:
        description: 'GitHub App ID for release automation'
        required: true
      RELEASE_APP_PRIVATE_KEY:
        description: 'GitHub App private key for release automation'
        required: true
    outputs:
      published:
        description: 'Whether packages were published'
        value: ${{ jobs.release.outputs.published }}
      version:
        description: 'The version that was published'
        value: ${{ jobs.release.outputs.version }}

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Generate token from GitHub App
        id: generate_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.RELEASE_APP_ID }}
          private_key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use GitHub App token to allow pushing to protected main branch
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ inputs.node-version }}
          install-deps: 'true'
          registry-url: ${{ inputs.registry-url }}
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate version constraints
        run: |
          echo "🔍 Checking version constraints..."

          current_version=$(node -p "require('./package.json').version")
          echo "Current version: $current_version"

          # Extract major version number
          major_version=$(echo "$current_version" | cut -d. -f1)

          if [ "$major_version" -ge 1 ]; then
            echo "❌ ERROR: Package is already at version 1.0.0 or higher ($current_version)"
            echo "Manual review required for versions >= 1.0.0"
            exit 1
          fi

          echo "✅ Version is 0.x.x - safe to proceed with automated releases"

      - name: Run semantic-release
        id: semantic_release
        env:
          CI: true
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Running semantic-release..."

          # Run semantic-release (analyzes commits, versions, updates changelog, publishes, creates tags)
          pnpm run release

          echo "✅ semantic-release complete"

      - name: Check if version was published
        id: check_published
        run: |
          # Check if a new version tag was created
          if git tag --points-at HEAD | grep -q "^v"; then
            NEW_VERSION=$(git tag --points-at HEAD | grep "^v" | head -1)
            echo "published=true" >> $GITHUB_OUTPUT
            echo "version=${NEW_VERSION#v}" >> $GITHUB_OUTPUT
            echo "✅ Published version: $NEW_VERSION"
          else
            echo "published=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No new version published (no releaseable commits)"
          fi

      - name: Set outputs
        id: publish
        run: |
          echo "published=${{ steps.check_published.outputs.published }}" >> $GITHUB_OUTPUT

      - name: Set version output
        id: get_version
        run: |
          echo "version=${{ steps.check_published.outputs.version }}" >> $GITHUB_OUTPUT
