# =============================================================================
# SHARED REUSABLE WORKFLOW - Direct Publish with Changesets
# =============================================================================
# This is a reusable workflow that implements automated versioning and publishing
# using Changesets with auto-generated changesets from conventional commits.
#
# Version bump rules:
# - Breaking changes (feat!, BREAKING CHANGE) → minor (0.x.0)
# - Features, fixes, perf → patch (0.0.x)
# - Other commits → no bump
#
# Usage in calling repository:
#   jobs:
#     release:
#       uses: happyvertical/sdk/.github/workflows/shared-direct-publish.yml@main
#       with:
#         node-version: '24'
#         registry-url: 'https://npm.pkg.github.com'
#       secrets:
#         HAVE_RELEASE_APP_ID: ${{ secrets.HAVE_RELEASE_APP_ID }}
#         HAVE_RELEASE_APP_PRIVATE_KEY: ${{ secrets.HAVE_RELEASE_APP_PRIVATE_KEY }}
# =============================================================================

name: Shared Direct Publish

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '24'
      registry-url:
        description: 'NPM registry URL'
        required: false
        type: string
        default: 'https://npm.pkg.github.com'
      skip-docs:
        description: 'Skip documentation deployment'
        required: false
        type: boolean
        default: false
    secrets:
      HAVE_RELEASE_APP_ID:
        description: 'GitHub App ID for release automation'
        required: true
      HAVE_RELEASE_APP_PRIVATE_KEY:
        description: 'GitHub App private key for release automation'
        required: true
    outputs:
      published:
        description: 'Whether packages were published'
        value: ${{ jobs.release.outputs.published }}
      version:
        description: 'The version that was published'
        value: ${{ jobs.release.outputs.version }}
      reason:
        description: 'Why publish ran, skipped, or produced no version change'
        value: ${{ jobs.release.outputs.reason }}

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version and Publish
    runs-on: arc-happyvertical
    timeout-minutes: 20
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.get_version.outputs.version }}
      reason: ${{ steps.get_reason.outputs.reason }}

    steps:
      - name: Generate token from GitHub App
        id: generate_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2
        with:
          app_id: ${{ secrets.HAVE_RELEASE_APP_ID }}
          private_key: ${{ secrets.HAVE_RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          # Use the release app token for tags, releases, and main-branch sync
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ inputs.node-version }}
          install-deps: 'true'
          registry-url: ${{ inputs.registry-url }}

      - name: Setup Turborepo cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate version constraints
        run: |
          echo "🔍 Checking version constraints..."

          current_version=$(node -p "require('./package.json').version")
          echo "Current version: $current_version"

          # Extract major version number
          major_version=$(echo "$current_version" | cut -d. -f1)

          if [ "$major_version" -ge 1 ]; then
            echo "❌ ERROR: Package is already at version 1.0.0 or higher ($current_version)"
            echo "Manual review required for versions >= 1.0.0"
            exit 1
          fi

          echo "✅ Version is 0.x.x - safe to proceed with automated releases"

      - name: Run Changesets release
        id: changesets_release
        env:
          CI: true
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "🚀 Running Changesets release..."

          # Store current version before release
          BEFORE_VERSION=$(node -p "require('./package.json').version")
          echo "Version before release: $BEFORE_VERSION"

          # Auto-generate changeset from conventional commits (if no changesets exist)
          pnpm run changeset:auto

          # Version packages (updates package.json and CHANGELOGs)
          pnpm run changeset:version

          # Sync root package.json version with workspace packages
          WORKSPACE_VERSION=$(node -p "require('./packages/utils/package.json').version")
          ROOT_VERSION=$(node -p "require('./package.json').version")
          if [ -n "$WORKSPACE_VERSION" ] && [ "$WORKSPACE_VERSION" != "$ROOT_VERSION" ]; then
            echo "📝 Syncing root package version to match workspace: $WORKSPACE_VERSION"
            node -e "
              const pkg = require('./package.json');
              pkg.version = '$WORKSPACE_VERSION';
              require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
          fi

          # Check if version changed
          AFTER_VERSION=$(node -p "require('./package.json').version")
          echo "Version after versioning: $AFTER_VERSION"

          if [ "$BEFORE_VERSION" != "$AFTER_VERSION" ]; then
            echo "📦 Version changed from $BEFORE_VERSION to $AFTER_VERSION"

            # Commit version changes
            git add .
            git commit -m "chore(release): v$AFTER_VERSION [skip ci]"

            # Build packages
            pnpm run build

            # Validate publishable artifacts before pushing packages
            pnpm run validate-build

            sync_target="HEAD:main"
            sync_rebuild_required=0

            sync_release_commit() {
              local attempt=1
              while [ "$attempt" -le 3 ]; do
                if git push origin "$sync_target"; then
                  echo "✅ Synced release commit to main"
                  return 0
                fi

                echo "⚠️  Main sync failed (attempt $attempt/3)"

                git fetch origin main --quiet || true
                if git rebase origin/main; then
                  sync_rebuild_required=1
                  echo "🔁 Rebased release commit onto latest main"
                else
                  echo "❌ Release commit could not be rebased onto latest main"
                  exit 1
                fi

                sleep $((attempt * 5))
                attempt=$((attempt + 1))
              done

              echo "❌ Failed to sync release commit to main before publish"
              exit 1
            }

            # Sync the release commit before publishing so main stays aligned
            # with the version/changelog state we are about to publish.
            sync_release_commit

            if [ "$sync_rebuild_required" -eq 1 ]; then
              echo "🔁 Rebuilding release artifacts after rebasing onto latest main"
              pnpm run build
              pnpm run validate-build
            fi

            # Publish packages
            pnpm run changeset:publish

            # Create and push git tag (idempotent - skip if tag already exists)
            if git rev-parse "v$AFTER_VERSION" >/dev/null 2>&1; then
              echo "ℹ️  Tag v$AFTER_VERSION already exists, skipping tag creation"
            else
              git tag "v$AFTER_VERSION"
              git push origin "v$AFTER_VERSION"
            fi

            # Create GitHub Release (idempotent - skip if release already exists)
            if gh release view "v$AFTER_VERSION" >/dev/null 2>&1; then
              echo "ℹ️  Release v$AFTER_VERSION already exists, skipping release creation"
            else
              RELEASE_NOTES="## Published Packages"$'\n\n'"All packages published to GitHub Packages at version $AFTER_VERSION."$'\n\n'"Full Changelog: https://github.com/${GITHUB_REPOSITORY}/compare/v$BEFORE_VERSION...v$AFTER_VERSION"

              gh release create "v$AFTER_VERSION" \
                --title "v$AFTER_VERSION" \
                --notes "$RELEASE_NOTES" \
                --latest
            fi

            echo "published=true" >> $GITHUB_OUTPUT
            echo "version=$AFTER_VERSION" >> $GITHUB_OUTPUT
            echo "reason=published" >> $GITHUB_OUTPUT
            echo "✅ Published version: v$AFTER_VERSION"
          else
            echo "ℹ️  No version changes - no release needed"
            echo "published=false" >> $GITHUB_OUTPUT
            echo "reason=no_version_changes" >> $GITHUB_OUTPUT
          fi

      - name: Check if version was published
        id: check_published
        run: |
          # Pass through the published status from the release step
          echo "published=${{ steps.changesets_release.outputs.published || 'false' }}" >> $GITHUB_OUTPUT
          echo "version=${{ steps.changesets_release.outputs.version || '' }}" >> $GITHUB_OUTPUT
          echo "reason=${{ steps.changesets_release.outputs.reason || '' }}" >> $GITHUB_OUTPUT

      - name: Set outputs
        id: publish
        run: |
          echo "published=${{ steps.check_published.outputs.published }}" >> $GITHUB_OUTPUT

      - name: Set version output
        id: get_version
        run: |
          echo "version=${{ steps.check_published.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Set reason output
        id: get_reason
        run: |
          echo "reason=${{ steps.check_published.outputs.reason }}" >> $GITHUB_OUTPUT
