# =============================================================================
# SHARED REUSABLE WORKFLOW - Direct Publish with Changesets
# =============================================================================
# This is a reusable workflow that implements automated versioning and publishing
# using Changesets with auto-generated changesets from conventional commits.
#
# Version bump rules:
# - Breaking changes (feat!, BREAKING CHANGE) → minor (0.x.0)
# - Features, fixes, perf → patch (0.0.x)
# - Other commits → no bump
#
# Usage in calling repository:
#   jobs:
#     release:
#       uses: happyvertical/sdk/.github/workflows/shared-direct-publish.yml@main
#       with:
#         node-version: '24'
#         registry-url: 'https://registry.npmjs.org'
#       secrets:
#         HAVE_RELEASE_APP_ID: ${{ secrets.HAVE_RELEASE_APP_ID }}
#         HAVE_RELEASE_APP_PRIVATE_KEY: ${{ secrets.HAVE_RELEASE_APP_PRIVATE_KEY }}
#         NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
# =============================================================================

name: Shared Direct Publish

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '24.18.0'
      registry-url:
        description: 'NPM registry URL'
        required: false
        type: string
        default: 'https://registry.npmjs.org'
      skip-docs:
        description: 'Skip documentation deployment'
        required: false
        type: boolean
        default: false
      recover-committed-release:
        description: 'Publish the current committed release version without generating a new version bump'
        required: false
        type: boolean
        default: false
    secrets:
      HAVE_RELEASE_APP_ID:
        description: 'GitHub App ID for release automation'
        required: true
      HAVE_RELEASE_APP_PRIVATE_KEY:
        description: 'GitHub App private key for release automation'
        required: true
      NPM_TOKEN:
        description: 'npm automation token for publishing public packages'
        required: true
    outputs:
      published:
        description: 'Whether packages were published'
        value: ${{ jobs.release.outputs.published }}
      version:
        description: 'The version that was published'
        value: ${{ jobs.release.outputs.version }}
      reason:
        description: 'Why publish ran, skipped, or produced no version change'
        value: ${{ jobs.release.outputs.reason }}

permissions:
  contents: write
  packages: read
  id-token: write

jobs:
  release:
    name: Version and Publish
    runs-on: ${{ vars.CI_NODE_RUNNER_ENABLED == 'true' && 'arc-happyvertical-node' || 'arc-happyvertical' }}
    timeout-minutes: 20
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.get_version.outputs.version }}
      reason: ${{ steps.get_reason.outputs.reason }}

    steps:
      - name: Generate token from GitHub App
        id: generate_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2
        with:
          app_id: ${{ secrets.HAVE_RELEASE_APP_ID }}
          private_key: ${{ secrets.HAVE_RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          # Use the release app token for tags, releases, and main-branch sync
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ inputs.node-version }}
          install-deps: 'true'

      - name: Configure npm publish registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry-url }}

      - name: Configure npm publish auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # shellcheck disable=SC2086,SC2094,SC2129
          set -euo pipefail

          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is empty or unavailable."
            exit 1
          fi

          registry="${{ inputs.registry-url }}"
          registry_auth_host="${registry#https:}"
          registry_auth_host="${registry_auth_host#http:}"
          registry_auth_host="${registry_auth_host%/}/"

          npm config set registry "$registry" --location=user
          npm config set "${registry_auth_host}:_authToken" "$NPM_TOKEN" --location=user
          npm whoami --registry "$registry" >/dev/null
          echo "✅ npm publish auth verified"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate version constraints
        run: |
          echo "🔍 Checking version constraints..."

          current_version=$(node -p "require('./package.json').version")
          echo "Current version: $current_version"

          # Extract major version number
          major_version=$(echo "$current_version" | cut -d. -f1)

          if [ "$major_version" -ge 1 ]; then
            echo "❌ ERROR: Package is already at version 1.0.0 or higher ($current_version)"
            echo "Manual review required for versions >= 1.0.0"
            exit 1
          fi

          echo "✅ Version is 0.x.x - safe to proceed with automated releases"

      - name: Run Changesets release
        id: changesets_release
        env:
          CI: true
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          echo "🚀 Running Changesets release..."

          publish_release_artifacts() {
            local version="$1"
            local previous_version="$2"
            local release_notes=""

            verify_public_npm_installs() {
              local version="$1"
              local packages_file

              npmjs_command() {
                local work_dir="$1"
                shift

                (
                  cd "$work_dir"
                  export HOME="$work_dir/home"
                  export npm_config_cache="$work_dir/npm-cache"
                  export npm_config_globalconfig="$work_dir/global-npmrc"
                  export npm_config_update_notifier=false
                  export npm_config_userconfig="$work_dir/.npmrc"
                  mkdir -p "$HOME" "$npm_config_cache"
                  : > "$npm_config_globalconfig"
                  printf 'registry=https://registry.npmjs.org/\n' > "$npm_config_userconfig"
                  unset GH_TOKEN GITHUB_TOKEN NODE_AUTH_TOKEN NPM_TOKEN
                  npm --registry=https://registry.npmjs.org "$@"
                )
              }

              wait_for_public_package_versions() {
                local packages_file="$1"
                local version="$2"
                local wait_dir
                local max_attempts=12

                wait_dir="$(mktemp -d)"

                for attempt in $(seq 1 "$max_attempts"); do
                  local -a missing_packages=()

                  while IFS= read -r package_name; do
                    if ! npmjs_command "$wait_dir" --prefer-online view "$package_name@$version" version >/dev/null 2>&1; then
                      missing_packages+=("$package_name")
                    fi
                  done < "$packages_file"

                  if [ "${#missing_packages[@]}" -eq 0 ]; then
                    rm -rf "$wait_dir"
                    return 0
                  fi

                  if [ "$attempt" -eq "$max_attempts" ]; then
                    echo "::error::Timed out waiting for published packages to become visible on registry.npmjs.org:"
                    printf '::error::  - %s\n' "${missing_packages[@]/%/@$version}"
                    rm -rf "$wait_dir"
                    return 1
                  fi

                  echo "Waiting for registry.npmjs.org propagation before install checks (attempt $attempt/$max_attempts):"
                  printf '  - %s\n' "${missing_packages[@]/%/@$version}"
                  sleep $((attempt * 10))
                done

                rm -rf "$wait_dir"
              }

              packages_file="$(mktemp)"
              RELEASE_VERSION="$version" node <<'NODE' > "$packages_file"
          const fs = require('fs');
          const path = require('path');

          const releaseVersion = process.env.RELEASE_VERSION;
          const candidates = new Set();

          function addPackageJson(filePath) {
            if (fs.existsSync(filePath)) {
              candidates.add(filePath);
            }
          }

          addPackageJson('package.json');

          for (const workspaceDir of ['packages']) {
            if (!fs.existsSync(workspaceDir)) {
              continue;
            }

            for (const entry of fs.readdirSync(workspaceDir, { withFileTypes: true })) {
              if (entry.isDirectory()) {
                addPackageJson(path.join(workspaceDir, entry.name, 'package.json'));
              }
            }
          }

          for (const packageJsonPath of [...candidates].sort()) {
            const pkg = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'));
            const publishRegistry = pkg.publishConfig?.registry ?? '';
            const rootWorkspacePackage =
              packageJsonPath === 'package.json' &&
              fs.existsSync('pnpm-workspace.yaml') &&
              !publishRegistry;

            if (
              !pkg.name ||
              pkg.private ||
              pkg.version !== releaseVersion ||
              rootWorkspacePackage ||
              (publishRegistry && !publishRegistry.includes('registry.npmjs.org'))
            ) {
              continue;
            }

            console.log(pkg.name);
          }
          NODE

              if [ ! -s "$packages_file" ]; then
                echo "ℹ️  No public npm packages at v$version found for clean-room install verification"
                rm -f "$packages_file"
                return 0
              fi

              echo "🔍 Verifying anonymous public npm installs for v$version"
              sed 's/^/  - /' "$packages_file"

              if ! wait_for_public_package_versions "$packages_file" "$version"; then
                rm -f "$packages_file"
                return 1
              fi

              while IFS= read -r package_name; do
                local smoke_dir
                smoke_dir="$(mktemp -d)"

                for attempt in 1 2 3; do
                  if npmjs_command "$smoke_dir" install \
                    --ignore-scripts \
                    --no-audit \
                    --no-fund \
                    --package-lock=false \
                    "$package_name@$version"; then
                    echo "✅ $package_name@$version resolves from public npm"
                    break
                  fi

                  if [ "$attempt" -eq 3 ]; then
                    echo "::error::Anonymous public npm install failed for $package_name@$version."
                    echo "::error::Check that all published dependency ranges are satisfiable from registry.npmjs.org."
                    rm -rf "$smoke_dir"
                    rm -f "$packages_file"
                    return 1
                  fi

                  echo "Install check for $package_name@$version failed on attempt $attempt; retrying after registry propagation delay..."
                  sleep $((attempt * 10))
                done

                rm -rf "$smoke_dir"
              done < "$packages_file"

              rm -f "$packages_file"
            }

            # Build packages
            pnpm run build

            # Validate publishable artifacts before pushing packages
            pnpm run validate-build

            # Publish packages
            pnpm run changeset:publish

            # Verify anonymous consumers can resolve the packages from public npm
            # before creating the release tag that marks the publish complete.
            verify_public_npm_installs "$version"

            # Create and push git tag (idempotent - skip if tag already exists)
            if git rev-parse "v$version" >/dev/null 2>&1; then
              echo "ℹ️  Tag v$version already exists, skipping tag creation"
            else
              git tag "v$version"
              git push origin "v$version"
            fi

            # Create GitHub Release (idempotent - skip if release already exists)
            if gh release view "v$version" >/dev/null 2>&1; then
              echo "ℹ️  Release v$version already exists, skipping release creation"
            else
              if [ -n "$previous_version" ] && [ "$previous_version" != "$version" ]; then
                release_notes="## Published Packages"$'\n\n'"All packages published to npm at version $version."$'\n\n'"Full Changelog: https://github.com/${GITHUB_REPOSITORY}/compare/v$previous_version...v$version"
              else
                release_notes="## Published Packages"$'\n\n'"All packages published to npm at version $version from committed release state on \`main\`."
              fi

              gh release create "v$version" \
                --title "v$version" \
                --notes "$release_notes" \
                --latest
            fi
          }

          # Store current version before release
          BEFORE_VERSION=$(node -p "require('./package.json').version")
          echo "Version before release: $BEFORE_VERSION"

          if git rev-parse "v$BEFORE_VERSION" >/dev/null 2>&1; then
            # Auto-generate changeset from conventional commits (if no changesets exist)
            pnpm run changeset:auto

            # Version packages (updates package.json and CHANGELOGs)
            pnpm run changeset:version
          else
            release_commit=$(git log \
              --fixed-strings \
              --grep="chore(release): v$BEFORE_VERSION" \
              --format='%H' \
              -n 1)

            if [ -z "$release_commit" ]; then
              echo "::error::Cannot recover committed release state because no chore(release): v$BEFORE_VERSION commit was found."
              exit 1
            fi

            releaseable_commits=$(git log "$release_commit"..HEAD --pretty=format:%s --no-merges | \
              grep -E '^(feat|fix|perf)(\(.+\))?!?:|^chore\(deps\)!?:|BREAKING CHANGE' || true)

            if [ -n "$releaseable_commits" ]; then
              echo "::error::Cannot recover v$BEFORE_VERSION because releaseable commits landed after the release commit:"
              echo "$releaseable_commits"
              exit 1
            fi

            if [ "${{ inputs.recover-committed-release }}" = "true" ]; then
              echo "ℹ️  Recovering committed release state for v$BEFORE_VERSION by explicit request"
            else
              echo "ℹ️  Tag v$BEFORE_VERSION is missing; safely recovering committed release state"
            fi
            echo "ℹ️  Skipping changeset generation/versioning to avoid a duplicate version bump"
          fi

          # Sync root package.json version with workspace packages
          WORKSPACE_VERSION=$(node -p "require('./packages/utils/package.json').version")
          ROOT_VERSION=$(node -p "require('./package.json').version")
          if [ -n "$WORKSPACE_VERSION" ] && [ "$WORKSPACE_VERSION" != "$ROOT_VERSION" ]; then
            echo "📝 Syncing root package version to match workspace: $WORKSPACE_VERSION"
            node -e "
              const pkg = require('./package.json');
              pkg.version = '$WORKSPACE_VERSION';
              require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
          fi

          # Check if version changed
          AFTER_VERSION=$(node -p "require('./package.json').version")
          echo "Version after versioning: $AFTER_VERSION"

          if [ "$BEFORE_VERSION" != "$AFTER_VERSION" ]; then
            echo "📦 Version changed from $BEFORE_VERSION to $AFTER_VERSION"

            # Commit version changes
            git add .
            git commit -m "chore(release): v$AFTER_VERSION"
            if git push origin HEAD:main; then
              echo "✅ Synced release commit to main"
            else
              echo "::error::Failed to push the release commit directly to main."
              echo "::error::Direct-on-main publishing requires the release bot to bypass the main ruleset."
              exit 1
            fi

            publish_release_artifacts "$AFTER_VERSION" "$BEFORE_VERSION"

            echo "published=true" >> $GITHUB_OUTPUT
            echo "version=$AFTER_VERSION" >> $GITHUB_OUTPUT
            echo "reason=published" >> $GITHUB_OUTPUT
            echo "✅ Published version: v$AFTER_VERSION"
          else
            if git rev-parse "v$AFTER_VERSION" >/dev/null 2>&1; then
              echo "ℹ️  No version changes - no release needed"
              echo "published=false" >> $GITHUB_OUTPUT
              echo "reason=no_version_changes" >> $GITHUB_OUTPUT
            else
              echo "📦 Current repository is already versioned at v$AFTER_VERSION but has not been tagged yet"
              echo "Publishing committed release state from main..."

              publish_release_artifacts "$AFTER_VERSION" ""

              echo "published=true" >> $GITHUB_OUTPUT
              echo "version=$AFTER_VERSION" >> $GITHUB_OUTPUT
              echo "reason=published" >> $GITHUB_OUTPUT
              echo "✅ Published committed release state: v$AFTER_VERSION"
            fi
          fi

      - name: Check if version was published
        id: check_published
        run: |
          # shellcheck disable=SC2086,SC2129
          # Pass through the published status from the release step
          echo "published=${{ steps.changesets_release.outputs.published || 'false' }}" >> $GITHUB_OUTPUT
          echo "version=${{ steps.changesets_release.outputs.version || '' }}" >> $GITHUB_OUTPUT
          echo "reason=${{ steps.changesets_release.outputs.reason || '' }}" >> $GITHUB_OUTPUT

      - name: Set outputs
        id: publish
        run: |
          # shellcheck disable=SC2086
          echo "published=${{ steps.check_published.outputs.published }}" >> $GITHUB_OUTPUT

      - name: Set version output
        id: get_version
        run: |
          # shellcheck disable=SC2086
          echo "version=${{ steps.check_published.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Set reason output
        id: get_reason
        run: |
          # shellcheck disable=SC2086
          echo "reason=${{ steps.check_published.outputs.reason }}" >> $GITHUB_OUTPUT
