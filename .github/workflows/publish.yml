# =============================================================================
# EDITABLE WORKFLOW - Customize for SDK
# =============================================================================
# This workflow is called by .github/workflows/happyvertical/on-merge-main.yml
# when code is merged to the main branch, after tests and build pass.
#
# Uses the shared direct publish workflow from SDK to version and publish
# packages directly from main.
# =============================================================================

name: Publish

on:
  workflow_call:
    outputs:
      published:
        description: 'Whether packages were published'
        value: ${{ jobs.release.outputs.published }}
      version:
        description: 'The version that was published'
        value: ${{ jobs.release.outputs.version }}
      reason:
        description: 'Why publish ran, skipped, or produced no version change'
        value: ${{ jobs.release.outputs.reason }}
    secrets:
      HAVE_RELEASE_APP_ID:
        description: 'GitHub App ID for release automation'
        required: true
      HAVE_RELEASE_APP_PRIVATE_KEY:
        description: 'GitHub App private key for release automation'
        required: true
      NPM_TOKEN:
        description: 'npm automation token for publishing public packages'
        required: true
  workflow_dispatch:
    inputs:
      skip-docs:
        description: 'Skip documentation deployment'
        required: false
        default: 'false'
        type: boolean
      recover-committed-release:
        description: 'Publish the current committed release version without generating a new version bump'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  packages: read
  id-token: write
  pages: write

jobs:
  release:
    name: Version and Publish
    uses: ./.github/workflows/shared-direct-publish.yml
    with:
      node-version: '24'
      registry-url: 'https://registry.npmjs.org'
      skip-docs: ${{ github.event.inputs.skip-docs == 'true' }}
      recover-committed-release: ${{ github.event.inputs.recover-committed-release == 'true' }}
    secrets:
      HAVE_RELEASE_APP_ID: ${{ secrets.HAVE_RELEASE_APP_ID }}
      HAVE_RELEASE_APP_PRIVATE_KEY: ${{ secrets.HAVE_RELEASE_APP_PRIVATE_KEY }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  sync-smrt:
    name: Sync SMRT SDK Dependencies
    runs-on: arc-happyvertical
    needs: [release]
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: write
      pull-requests: write
      packages: read
    steps:
      - name: Generate token from GitHub App
        id: generate_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2
        with:
          app_id: ${{ secrets.HAVE_RELEASE_APP_ID }}
          private_key: ${{ secrets.HAVE_RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout SDK repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout SMRT repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: happyvertical/smrt
          path: smrt
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6
        with:
          package_json_file: smrt/package.json
          run_install: false

      - name: Update SMRT SDK dependency pins
        run: |
          node scripts/update-smrt-sdk-version.js \
            "$GITHUB_WORKSPACE/smrt" \
            "${{ needs.release.outputs.version }}"

          cd smrt
          # Private legacy SDK packages intentionally stay on GitHub Packages.
          # Resolve the newly public SDK packages from npmjs for this lockfile refresh.
          cp .npmrc .npmrc.sdk-sync.bak
          trap 'mv .npmrc.sdk-sync.bak .npmrc' EXIT
          grep -v '^@happyvertical:registry=' .npmrc.sdk-sync.bak > .npmrc
          echo '@happyvertical:registry=https://registry.npmjs.org' >> .npmrc
          pnpm install --lockfile-only --ignore-scripts
          mv .npmrc.sdk-sync.bak .npmrc
          trap - EXIT
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for SMRT changes
        id: changes
        run: |
          cd smrt
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No SMRT SDK dependency changes needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git
        if: steps.changes.outputs.changed == 'true'
        run: |
          cd smrt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push SMRT update branch
        if: steps.changes.outputs.changed == 'true'
        env:
          SDK_VERSION: ${{ needs.release.outputs.version }}
        run: |
          cd smrt
          branch="sdk-release/v$SDK_VERSION"
          git checkout -B "$branch"
          git add pnpm-workspace.yaml package.json pnpm-lock.yaml
          git commit -m "chore(deps): sync sdk packages to v$SDK_VERSION"
          git push --force-with-lease origin "$branch"
          echo "SMRT_BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Open or update SMRT pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          SDK_VERSION: ${{ needs.release.outputs.version }}
        run: |
          existing_pr=$(gh pr list \
            --repo happyvertical/smrt \
            --state open \
            --head "$SMRT_BRANCH" \
            --json number \
            --jq '.[0].number // empty')

          pr_body=$(cat <<EOF
          ## Summary
          - update SMRT's centralized SDK dependency pins to \`^$SDK_VERSION\`
          - refresh the lockfile immediately after the SDK release

          ## Source
          - SDK release: \`v$SDK_VERSION\`
          - Triggered from: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )

          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" \
              --repo happyvertical/smrt \
              --title "chore(deps): sync sdk packages to v$SDK_VERSION" \
              --body "$pr_body"
          else
            gh pr create \
              --repo happyvertical/smrt \
              --base main \
              --head "$SMRT_BRANCH" \
              --title "chore(deps): sync sdk packages to v$SDK_VERSION" \
              --body "$pr_body"
          fi

  # NOTE: SMRT now receives an immediate dependency-sync PR on each SDK release.
  # Other downstream repositories continue to receive Renovate-driven updates.

  deploy-docs:
    name: Deploy Documentation
    runs-on: arc-happyvertical
    needs: [release]
    if: github.event.inputs.skip-docs != 'true'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'

      - name: Setup Turborepo cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-docs-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-docs-
            ${{ runner.os }}-turbo-

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build documentation site
        run: pnpm run docs:site:build
        env:
          NODE_OPTIONS: --max_old_space_size=8192

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
