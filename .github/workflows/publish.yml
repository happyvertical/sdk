name: Publish

on:
  workflow_call:
    inputs:
      publish-mode:
        description: 'Artifact publisher by default; Changesets is an emergency fallback'
        required: false
        type: string
        default: artifacts
      skip-docs:
        description: 'Skip documentation deployment'
        required: false
        type: boolean
        default: false
      recover-committed-release:
        description: 'Publish the current committed version when its tag is missing'
        required: false
        type: boolean
        default: false
    outputs:
      published:
        description: 'Whether packages were published'
        value: ${{ jobs.release.outputs.published }}
      version:
        description: 'The version that was published'
        value: ${{ jobs.release.outputs.version }}
      reason:
        description: 'Why publish ran, skipped, or produced no version change'
        value: ${{ jobs.release.outputs.reason }}
    secrets:
      HAVE_RELEASE_APP_ID:
        required: true
      HAVE_RELEASE_APP_PRIVATE_KEY:
        required: true
      NPM_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      publish-mode:
        description: 'Publishing implementation'
        required: true
        type: choice
        default: artifacts
        options: [artifacts, changesets]
      skip-docs:
        description: 'Skip documentation deployment'
        required: false
        default: false
        type: boolean
      recover-committed-release:
        description: 'Publish the current committed version when its tag is missing'
        required: false
        default: false
        type: boolean

env:
  PUBLISH_PACK_SHARD_COUNT: '2'

permissions:
  contents: write
  packages: read
  id-token: write
  pages: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      previous-version: ${{ steps.prepare.outputs.previous_version }}
      should-publish: ${{ steps.prepare.outputs.should_publish }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Generate release token
        id: token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2
        with:
          app_id: ${{ secrets.HAVE_RELEASE_APP_ID }}
          private_key: ${{ secrets.HAVE_RELEASE_APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          registry-url: 'https://registry.npmjs.org'
          auth-token: ${{ secrets.NPM_TOKEN }}
          github-packages-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare versioned workspace
        id: prepare
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          RECOVER_COMMITTED_RELEASE: ${{ inputs.recover-committed-release || false }}
        run: |
          set -euo pipefail
          before=$(node -p "require('./package.json').version")
          echo "previous_version=$before" >> "$GITHUB_OUTPUT"

          if git rev-parse "v$before" >/dev/null 2>&1; then
            pnpm run changeset:auto
            pnpm run changeset:version
            after=$(node -p "require('./packages/utils/package.json').version")
          else
            release_commit=$(git log --fixed-strings --grep="chore(release): v$before" --format='%H' -n 1)
            if [ -z "$release_commit" ]; then
              echo "No release commit found for untagged v$before"
              exit 1
            fi
            releaseable=$(git log "$release_commit"..HEAD --pretty=format:%s --no-merges | \
              grep -E '^(feat|fix|perf)(\(.+\))?!?:|^chore\(deps\)!?:|BREAKING CHANGE' || true)
            if [ -n "$releaseable" ]; then
              echo 'Releaseable commits landed after the untagged release commit:'
              echo "$releaseable"
              exit 1
            fi
            echo "Recovering committed release v$before"
            after=$before
          fi

          AFTER_VERSION="$after" node -e "const fs=require('fs'); const p=require('./package.json'); p.version=process.env.AFTER_VERSION; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"
          if [ "${after%%.*}" -ge 1 ]; then
            echo "Major release $after requires manual approval"
            exit 1
          fi
          if [ "$before" = "$after" ] && git rev-parse "v$after" >/dev/null 2>&1; then
            echo 'should_publish=false' >> "$GITHUB_OUTPUT"
            echo 'version=' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'should_publish=true' >> "$GITHUB_OUTPUT"
          echo "version=$after" >> "$GITHUB_OUTPUT"
          git diff --binary > release-version.patch
          rm -rf .turbo
          find packages -type d -name dist -prune -exec rm -rf {} +
          TURBO_FORCE=true pnpm run build
          pnpm run validate-build
      - name: Archive versioned workspace
        if: steps.prepare.outputs.should_publish == 'true'
        run: |
          {
            printf '%s\n' package.json pnpm-lock.yaml
            find packages -type f \( -name package.json -o -name CHANGELOG.md -o -path '*/dist/*' \) -print
          } | sort -u > publish-workspace-files
          tar -cf publish-workspace.tar -T publish-workspace-files
      - name: Upload release patch
        if: steps.prepare.outputs.should_publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-release-version-patch
          path: release-version.patch
          retention-days: 1
          if-no-files-found: error
      - name: Upload versioned workspace
        if: steps.prepare.outputs.should_publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-release-workspace
          path: publish-workspace.tar
          retention-days: 1
          if-no-files-found: error

  pack-release:
    needs: prepare-release
    if: needs.prepare-release.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download versioned workspace
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: publish-release-workspace
          path: release-workspace
      - name: Extract versioned workspace
        run: tar -xf release-workspace/publish-workspace.tar
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          github-packages-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack and validate shard
        run: node scripts/validate-publish-packages.mjs
        env:
          PUBLISH_PACK_SHARD_INDEX: ${{ matrix.shard }}
          PUBLISH_PACK_OUTPUT_DIR: publish-pack-output
      - name: Upload verified tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-release-pack-${{ matrix.shard }}
          path: publish-pack-output/
          retention-days: 1
          if-no-files-found: error

  publish-release:
    name: Publish Verified Release
    needs: [prepare-release, pack-release]
    if: needs.prepare-release.outputs.should-publish == 'true' && needs.pack-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-publish-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Generate release token
        id: token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2
        with:
          app_id: ${{ secrets.HAVE_RELEASE_APP_ID }}
          private_key: ${{ secrets.HAVE_RELEASE_APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      - name: Download release patch
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: publish-release-version-patch
          path: release-patch
      - name: Apply release patch
        run: if [ -s release-patch/release-version.patch ]; then git apply --binary release-patch/release-version.patch; fi
      - name: Download versioned workspace
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: publish-release-workspace
          path: release-workspace
      - name: Extract versioned workspace
        run: tar -xf release-workspace/publish-workspace.tar
      - name: Download verified tarballs
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          pattern: publish-release-pack-*
          path: publish-pack-output
          merge-multiple: true
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          registry-url: 'https://registry.npmjs.org'
          auth-token: ${{ secrets.NPM_TOKEN }}
          github-packages-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify, publish, and record release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PREVIOUS_VERSION: ${{ needs.prepare-release.outputs.previous-version }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          PUBLISH_MODE: ${{ inputs.publish-mode || 'artifacts' }}
        run: |
          set -euo pipefail
          node scripts/verify-publish-artifacts.mjs publish-pack-output
          git add -A .changeset package.json pnpm-lock.yaml packages
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v$RELEASE_VERSION [skip ci]"
          fi

          if [ "$PUBLISH_MODE" = artifacts ]; then
            node scripts/publish-validated-artifacts.mjs publish-pack-output
          elif [ "$PUBLISH_MODE" = changesets ]; then
            echo 'Using temporary emergency Changesets fallback'
            pnpm run changeset:publish
          else
            echo "Unsupported publish mode: $PUBLISH_MODE"
            exit 1
          fi

          git tag -f "v$RELEASE_VERSION"
          git push --no-verify origin HEAD:main
          git push --no-verify -f origin "v$RELEASE_VERSION"
          if ! gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release create "v$RELEASE_VERSION" \
              --title "v$RELEASE_VERSION" \
              --notes "All SDK packages were published from verified SHA-256 tarballs. Full changelog: https://github.com/${GITHUB_REPOSITORY}/compare/v${PREVIOUS_VERSION}...v${RELEASE_VERSION}" \
              --latest
          fi

  release:
    name: Release Result
    needs: [prepare-release, pack-release, publish-release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      published: ${{ steps.result.outputs.published }}
      version: ${{ steps.result.outputs.version }}
      reason: ${{ steps.result.outputs.reason }}
    steps:
      - name: Evaluate release result
        id: result
        env:
          PREPARE: ${{ needs.prepare-release.result }}
          SHOULD_PUBLISH: ${{ needs.prepare-release.outputs.should-publish }}
          PUBLISH: ${{ needs.publish-release.result }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          if [ "$PREPARE" != success ]; then exit 1; fi
          if [ "$SHOULD_PUBLISH" != true ]; then
            {
              echo 'published=false'
              echo 'version='
              echo 'reason=no_version_changes'
            } >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISH" = success ]; then
            {
              echo 'published=true'
              echo "version=$VERSION"
              echo 'reason=published'
            } >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

  sync-smrt:
    name: Sync SMRT SDK Dependencies
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: write
      pull-requests: write
      packages: read
    steps:
      - name: Generate release token
        id: token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2
        with:
          app_id: ${{ secrets.HAVE_RELEASE_APP_ID }}
          private_key: ${{ secrets.HAVE_RELEASE_APP_PRIVATE_KEY }}
      - name: Checkout SDK repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Checkout SMRT repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: happyvertical/smrt
          path: smrt
          token: ${{ steps.token.outputs.token }}
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.18.0'
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: smrt/package.json
          run_install: false
      - name: Update SMRT dependency pins
        env:
          SDK_VERSION: ${{ needs.release.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/update-smrt-sdk-version.js "$GITHUB_WORKSPACE/smrt" "$SDK_VERSION"
          cd smrt
          cp .npmrc .npmrc.sdk-sync.bak
          trap 'mv .npmrc.sdk-sync.bak .npmrc' EXIT
          grep -v '^@happyvertical:registry=' .npmrc.sdk-sync.bak > .npmrc
          echo '@happyvertical:registry=https://registry.npmjs.org' >> .npmrc
          pnpm install --lockfile-only --ignore-scripts
          mv .npmrc.sdk-sync.bak .npmrc
          trap - EXIT
      - name: Commit and open dependency update
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SDK_VERSION: ${{ needs.release.outputs.version }}
        run: |
          cd smrt
          if git diff --quiet; then exit 0; fi
          branch="sdk-release/v$SDK_VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add pnpm-workspace.yaml package.json pnpm-lock.yaml
          git commit -m "chore(deps): sync sdk packages to v$SDK_VERSION"
          git push --force-with-lease origin "$branch"
          existing=$(gh pr list --repo happyvertical/smrt --state open --head "$branch" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --repo happyvertical/smrt --base main --head "$branch" \
              --title "chore(deps): sync sdk packages to v$SDK_VERSION" \
              --body "Update centralized SDK dependency pins to ^$SDK_VERSION after the verified SDK release."
          fi

  deploy-docs:
    name: Deploy Documentation
    needs: release
    if: inputs.skip-docs != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          github-packages-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build documentation
        run: pnpm run docs:site:build
        env:
          NODE_OPTIONS: --max_old_space_size=8192
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/build
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
