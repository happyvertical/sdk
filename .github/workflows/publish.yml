# =============================================================================
# EDITABLE WORKFLOW - Customize for SDK
# =============================================================================
# This workflow is called by .github/workflows/happyvertical/on-merge-main.yml
# when code is merged to the main branch, after tests and build pass.
#
# Uses the shared direct publish workflow from SDK to version and publish
# packages without creating intermediate "Version Packages" PRs.
# =============================================================================

name: Publish

on:
  workflow_call:
    secrets:
      HAVE_RELEASE_APP_ID:
        description: 'GitHub App ID for release automation'
        required: true
      HAVE_RELEASE_APP_PRIVATE_KEY:
        description: 'GitHub App private key for release automation'
        required: true
      GH_TOKEN:
        description: 'GitHub token for triggering cascades'
        required: false
  workflow_dispatch:
    inputs:
      skip-docs:
        description: 'Skip documentation deployment'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write
  pages: write

jobs:
  release:
    name: Version and Publish
    uses: ./.github/workflows/shared-direct-publish.yml
    with:
      node-version: '24'
      registry-url: 'https://npm.pkg.github.com'
      skip-docs: ${{ github.event.inputs.skip-docs == 'true' }}
    secrets:
      HAVE_RELEASE_APP_ID: ${{ secrets.HAVE_RELEASE_APP_ID }}
      HAVE_RELEASE_APP_PRIVATE_KEY: ${{ secrets.HAVE_RELEASE_APP_PRIVATE_KEY }}

  cascade:
    name: Trigger Dependency Cascade
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.outputs.published == 'true'

    steps:
      - name: Trigger dependency cascade
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "📢 Triggering dependency cascade for downstream repositories..."

          version="${{ needs.release.outputs.version }}"
          echo "Published version: $version"

          # Trigger SMRT with version information
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/happyvertical/smrt/dispatches \
            -f event_type='dependency-updated' \
            -f 'client_payload[repository]=happyvertical/sdk' \
            -f "client_payload[version]=$version"

          echo "✅ Triggered SMRT dependency cascade"

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: [release]
    if: github.event.inputs.skip-docs != 'true'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-docs-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-docs-
            ${{ runner.os }}-turbo-

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build documentation site
        run: pnpm run docs:site:build
        env:
          NODE_OPTIONS: --max_old_space_size=8192

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
