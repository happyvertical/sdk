name: GitHub-hosted Runner Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    name: GitHub-hosted Runner Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          github-packages-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub-hosted runner setup
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = 'github-hosted'
          test "$(node --version)" = 'v24.18.0'
          test "$(pnpm --version)" = '11.13.0'
          command -v psql

      - name: Verify Actions-backed pnpm cache selection
        env:
          STORE_PATH: ${{ steps.setup.outputs.store-path }}
          USE_ACTIONS_CACHE: ${{ steps.setup.outputs.use-actions-cache }}
        run: |
          set -euo pipefail
          test "$USE_ACTIONS_CACHE" = 'true'
          test -z "${PNPM_STORE_DIR:-}"

          # `pnpm store path` appends a store-version segment (.../v11), so the
          # configured hosted cache root is a prefix of the resolved path.
          store_root="${HOME%/}/.local/share/pnpm/store"
          case "$STORE_PATH" in
            "$store_root" | "$store_root"/*) ;;
            *)
              echo "::error::pnpm resolved $STORE_PATH, outside the hosted Actions cache root $store_root"
              exit 1
              ;;
          esac
          echo "Verified Actions-backed store selection: $STORE_PATH"

      # Proves the hosted cache's restored store and workspace can hardlink.
      - name: Verify pnpm hardlink layout
        run: |
          set -euo pipefail
          store_dir=$(pnpm store path --silent)
          test "$(stat -c '%d' "$store_dir")" = "$(stat -c '%d' "$GITHUB_WORKSPACE")"
          linked_file=$(find node_modules/.pnpm -type f -links +1 -print -quit)
          test -n "$linked_file"
          test "$(stat -c '%h' "$linked_file")" -gt 1
          echo "Verified installed hardlink: $linked_file"

      - name: Verify disposable PostgreSQL lifecycle
        run: node scripts/run-with-ci-postgres.mjs -- psql --command 'SELECT current_database()'
        env:
          CI_POSTGRES_BASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  store-reuse:
    name: GitHub-hosted Actions Cache
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          github-packages-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Actions cache restore
        env:
          CACHE_HIT: ${{ steps.setup.outputs.pnpm-cache-hit }}
          USE_ACTIONS_CACHE: ${{ steps.setup.outputs.use-actions-cache }}
        run: |
          set -euo pipefail
          test "$USE_ACTIONS_CACHE" = 'true'

          # A cache miss is expected on a new key. The workflow still verifies
          # that the composite action selected the hosted cache strategy.
          if [ "$CACHE_HIT" = 'true' ]; then
            summary='pnpm store restored from the GitHub Actions cache.'
          else
            summary='pnpm store cache miss; GitHub Actions will populate it after this job.'
            echo "::notice::$summary"
          fi
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo "$summary"
