name: Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Triage Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { triageIssue } = await import('@happyvertical/github-actions');

            const triageContext = {
              token: process.env.GITHUB_TOKEN,
              owner: context.repo.owner,
              repo: context.repo.repo,
              issueNumber: context.issue.number,
              issueTitle: context.payload.issue.title,
              issueBody: context.payload.issue.body,
              issueAuthor: context.payload.issue.user.login,
              config: {
                repoDescription: '${{ vars.REPO_DESCRIPTION || github.repository }}',
                packagePattern: '${{ vars.PACKAGE_PATTERN }}',
                packageExamples: '${{ vars.PACKAGE_EXAMPLES }}'.split(',').filter(Boolean),
                projectEnabled: ${{ vars.PROJECT_ENABLED == 'true' }},
                projectId: '${{ vars.PROJECT_ID }}',
                statusFieldId: '${{ vars.STATUS_FIELD_ID }}',
                statusOptions: ${{ toJSON(vars.STATUS_OPTIONS) }}
              }
            };

            await triageIssue(triageContext);
