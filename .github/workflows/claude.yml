name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

# Prevent multiple Claude runs on same issue/PR
concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.event.issue.number ||
    github.event.pull_request.number ||
    github.event.comment.id }}
  cancel-in-progress: true

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'blocker') ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') ||
        contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Allow Claude to push commits and create branches
      pull-requests: write   # Allow Claude to create and update PRs
      issues: write          # Allow Claude to comment and update issues
      actions: read          # Allow Claude to read CI results on PRs
      id-token: write        # Required for authentication
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Fetch full history for better context when creating PRs
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@7145c3e0510bcdbdd29f67cc4a8c1958f1acfa2f # v1
        with:
          # Use OAuth token for Claude Max plan subscription
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Custom prompt when triggered by "blocker" label
          # Otherwise Claude uses the @claude mention content
          prompt: >-
            ${{ github.event.action == 'labeled' &&
            github.event.label.name == 'blocker' &&
            'This issue has been marked as a blocker (high priority).
            Please analyze the issue, implement a solution,
            and create a PR to resolve it.' || '' }}

          # Allow Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Configure allowed tools for security and functionality
          # Allows: git operations, GitHub CLI, package management, and file operations
          claude_args: >-
            --allowed-tools
            "Bash(git *:*)"
            --allowed-tools
            "Bash(gh pr:*)"
            --allowed-tools
            "Bash(gh issue:*)"
            --allowed-tools
            "Bash(pnpm *:*)"
            --allowed-tools
            "Bash(npm *:*)"
            --allowed-tools
            "Bash(npx *:*)"
            --allowed-tools
            "Bash(node *:*)"
            --allowed-tools
            "Read"
            --allowed-tools
            "Write"
            --allowed-tools
            "Edit"
            --allowed-tools
            "Glob"
            --allowed-tools
            "Grep"
            --allowed-tools
            "Bash(ls *:*)"
            --allowed-tools
            "Bash(cat *:*)"
            --allowed-tools
            "Bash(grep *:*)"
            --allowed-tools
            "Bash(find *:*)"
