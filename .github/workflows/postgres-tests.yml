name: PostgreSQL Tests

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: 'Trusted caller-selected revision to validate'
        required: false
        type: string
        default: ''
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read
  packages: read

env:
  CHECKOUT_REF: ${{ inputs.checkout_ref || github.sha }}

jobs:
  # One backend only: every run provisions its own PostgreSQL service
  # container, so there is nothing to select between and no shared state to
  # clean up afterwards.
  postgres:
    name: Registered PostgreSQL Suites
    if: github.event_name == 'workflow_dispatch' || vars.CI_POSTGRES_ENABLED == 'true'
    runs-on: arc-happyvertical
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          github-packages-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run registered PostgreSQL suites
        run: pnpm turbo run test:postgres --concurrency=2
        env:
          CI_POSTGRES_BASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          NODE_ENV: test
