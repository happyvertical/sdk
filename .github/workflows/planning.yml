name: Planning Workflow

on:
  # Trigger when issue is moved to Planning column in project
  # This requires a webhook or manual trigger since GitHub doesn't have
  # a direct event for project column changes
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to plan'
        required: true
        type: number
      action:
        description: 'Planning action'
        required: true
        type: choice
        options:
          - start
          - complete

permissions:
  issues: write
  contents: read
  packages: read

jobs:
  planning:
    runs-on: arc-happyvertical
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@happyvertical'

      - name: Install dependencies
        run: |
          echo "@happyvertical:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
          npm install @happyvertical/github-actions@0.55.0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute Planning Workflow
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pkgPath = '${{ github.workspace }}/node_modules';
            const { startPlanning, completePlanning } = await import(
              `${pkgPath}/@happyvertical/github-actions/dist/index.js`
            );

            const planningContext = {
              token: process.env.GITHUB_TOKEN,
              owner: context.repo.owner,
              repo: context.repo.repo,
              issueNumber: ${{ inputs.issue_number }},
              issueTitle: '',  // Will be fetched by the module
              issueBody: '',
              issueAuthor: '',
              config: {
                repoDescription: '${{ vars.REPO_DESCRIPTION || github.repository }}',
                packagePattern: '${{ vars.PACKAGE_PATTERN }}',
                packageExamples: '${{ vars.PACKAGE_EXAMPLES }}'.split(',').filter(Boolean),
                projectId: '${{ vars.PROJECT_ID }}',
                statusFieldId: '${{ vars.STATUS_FIELD_ID }}',
                statusOptions: ${{ toJSON(vars.STATUS_OPTIONS) }}
              }
            };

            if ('${{ inputs.action }}' === 'start') {
              await startPlanning(planningContext);
            } else if ('${{ inputs.action }}' === 'complete') {
              await completePlanning(planningContext);
            }
