# =============================================================================
# EDITABLE WORKFLOW - Customize for SDK
# =============================================================================
# This workflow is called by .github/workflows/happyvertical/on-merge-main.yml
# when code is merged to the main branch.
#
# Customize the test process for the SDK below.
# =============================================================================

name: Test

on:
  workflow_call:
    outputs:
      success:
        description: 'Whether tests passed'
        value: ${{ jobs.test.outputs.success }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    # PostgreSQL service for database tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
          PGUSER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    outputs:
      success: ${{ steps.test-result.outputs.success }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get Playwright version
        id: playwright-version
        shell: bash
        run: |
          version=$(npm list playwright --depth=0 --json 2>/dev/null \
            | jq -r '.dependencies.playwright.version // "1.54.2"')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: |
            ${{ runner.os }}-playwright-${{
              steps.playwright-version.outputs.version
            }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install system dependencies for ONNX Runtime
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libstdc++6 \
            libc6-dev \
            build-essential \
            gcc \
            g++ \
            cmake \
            libgomp1 \
            libprotobuf-dev

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: |
            ${{ runner.os }}-turbo-${{ hashFiles(
              '**/package.json',
              '**/pnpm-lock.yaml',
              'packages/*/src/**',
              'packages/*/test/**'
            ) }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Cache build outputs
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            .turbo
          key: |
            ${{ runner.os }}-build-${{ hashFiles(
              'packages/*/src/**',
              'packages/*/test/**',
              'packages/*/package.json',
              'packages/*/tsconfig.json'
            ) }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Build packages
        run: pnpm run build

      - name: Run typecheck, lint, and tests in parallel
        id: parallel-checks
        run: |
          # Run typecheck, lint, and test in parallel using Turborepo
          pnpm turbo run typecheck lint test --parallel
        env:
          SQLOO_HOST: localhost
          SQLOO_USER: postgres
          SQLOO_PASSWORD: postgres
          SQLOO_DATABASE: testdb
          SQLOO_PORT: 5432

      - name: Set test result
        id: test-result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.parallel-checks.outcome }}" = "success" ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
