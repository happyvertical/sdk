# =============================================================================
# EDITABLE WORKFLOW - Customize for SDK
# =============================================================================
# This workflow is called by .github/workflows/happyvertical/on-merge-main.yml
# when code is merged to the main branch.
#
# Customize the test process for the SDK below.
# =============================================================================

name: Test

on:
  workflow_call:
    outputs:
      success:
        description: 'Whether tests passed'
        value: ${{ jobs.test.outputs.success }}
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Run Tests
    runs-on: arc-happyvertical

    # PostgreSQL service for database tests
    services:
      postgres:
        image: postgres:18-alpine@sha256:035b9ab53cfa147d7202b61f5f7782b939ae815b7d6bc81c96b7b42ff1fca950
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
          PGUSER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    outputs:
      success: ${{ steps.test-result.outputs.success }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24'

      - name: Setup Turborepo cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: .turbo
          key: |
            ${{ runner.os }}-turbo-${{ hashFiles(
              '**/package.json',
              '**/pnpm-lock.yaml',
              'packages/*/src/**',
              'packages/*/test/**'
            ) }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Cache build outputs
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: |
            packages/*/dist
          key: |
            ${{ runner.os }}-build-${{ hashFiles(
              'packages/*/src/**',
              'packages/*/test/**',
              'packages/*/package.json',
              'packages/*/tsconfig.json'
            ) }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Build packages
        run: pnpm run build

      - name: Run typecheck, lint, and tests in parallel
        id: parallel-checks
        run: |
          # Run typecheck, lint, and test in parallel using Turborepo
          # Exclude @have/docs: docs build requires deps:all
          pnpm turbo run typecheck lint test --parallel --filter='!@have/docs'
        env:
          SQLOO_HOST: localhost
          SQLOO_USER: postgres
          SQLOO_PASSWORD: postgres
          SQLOO_DATABASE: testdb
          SQLOO_PORT: 5432

      - name: Set test result
        id: test-result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.parallel-checks.outcome }}" = "success" ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
