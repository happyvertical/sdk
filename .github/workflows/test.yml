name: Test

on:
  workflow_call:
    inputs:
      mode:
        description: 'full for exhaustive validation; affected for PR feedback'
        required: false
        type: string
        default: full
    outputs:
      success:
        description: 'Whether the selected validation suite passed'
        value: ${{ jobs.validate.outputs.success }}
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validation scope'
        required: true
        type: choice
        default: full
        options: [full, affected]

permissions:
  contents: read
  packages: read

jobs:
  validate:
    # Keep this name stable: the main-branch ruleset requires
    # "Validate Changes / Run Tests" from the calling workflow.
    name: Run Tests
    runs-on: ${{ vars.CI_NODE_RUNNER_ENABLED == 'true' && 'arc-happyvertical-node' || 'arc-happyvertical' }}
    timeout-minutes: 40
    outputs:
      success: ${{ steps.result.outputs.success }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '24.18.0'
          github-packages-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run exhaustive build, typecheck, lint, tests, and optional adapters
        id: exhaustive
        if: inputs.mode == 'full'
        run: |
          pnpm turbo run build typecheck lint test test:optional \
            --filter='!@happyvertical/docs' --concurrency=2
          pnpm run validate-build
          pnpm run agent:check
        env:
          NODE_ENV: test
          TURBO_FORCE: 'true'

      - name: Run affected package and dependency closures
        id: affected
        if: inputs.mode == 'affected'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NODE_ENV: test
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo 'Affected mode requires a pull_request base SHA'
            exit 1
          fi
          pnpm turbo run build typecheck lint test test:optional \
            --filter="...[$BASE_SHA]" --filter='!@happyvertical/docs' \
            --concurrency=2

      - name: Set validation result
        id: result
        if: always()
        env:
          MODE: ${{ inputs.mode }}
          EXHAUSTIVE: ${{ steps.exhaustive.outcome }}
          AFFECTED: ${{ steps.affected.outcome }}
        run: |
          outcome="$EXHAUSTIVE"
          if [ "$MODE" = 'affected' ]; then outcome="$AFFECTED"; fi
          if [ "$outcome" != 'success' ]; then
            echo 'success=false' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo 'success=true' >> "$GITHUB_OUTPUT"
