version: 2
updates:
  # Enable version updates for Bun
  - package-ecosystem: "bun"
    # Look for `package.json` and `bun.lock` files in the root directory
    directory: "/"
    # Check for updates once a week
    schedule:
      interval: "weekly"
    # Allow up to 10 open pull requests at a time
    open-pull-requests-limit: 10
    # Set a version update strategy
    versioning-strategy: increase
    # Groups to reduce PR noise
    groups:
      # Group all dev dependencies together
      dev-dependencies:
        patterns:
          - "@biomejs/*"
          - "typescript"
          - "vitest"
          - "lefthook"
          - "standard-version"
          - "@changesets/*"
          - "conventional-changelog-cli"
    
  # Core packages
  - package-ecosystem: "bun"
    directory: "/packages/core/types"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    package-manager: "npm"

