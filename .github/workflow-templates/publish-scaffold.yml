# =============================================================================
# EDITABLE WORKFLOW - Customize for this repository
# =============================================================================
# This workflow is called by .github/workflows/happyvertical/on-merge-main.yml
# when code is merged to the main branch, after tests and build pass.
#
# Customize the publish process for this repository below.
# =============================================================================

name: Publish

on:
  workflow_call:  # Called by standard workflows
  workflow_dispatch:  # Allow manual triggering

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build packages
        run: pnpm build

      - name: Publish packages
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
