# =============================================================================
# EDITABLE WORKFLOW - Customize for this repository
# =============================================================================
# This workflow is called by .github/workflows/happyvertical/on-merge-main.yml
# when code is merged to the main branch, after tests pass.
#
# Customize the build process for this repository below.
# =============================================================================

name: Build

on:
  workflow_call:  # Called by standard workflows
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build
