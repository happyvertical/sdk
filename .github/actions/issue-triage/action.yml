name: 'AI Issue Triage'
description: 'Run AI-powered issue triage using GitHub Models API'
author: 'HappyVertical'

inputs:
  github-token:
    description: 'GitHub token with models permission'
    required: true
  config-path:
    description: 'Path to triage config file'
    required: false
    default: '.github/triage-config.json'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '24'

    - name: Install pnpm (SDK repo only)
      shell: bash
      if: github.repository == 'happyvertical/sdk'
      run: npm install -g pnpm

    - name: Install dependencies (SDK repo only)
      shell: bash
      if: github.repository == 'happyvertical/sdk'
      working-directory: packages/github-actions
      run: pnpm install

    - name: Build package (SDK repo only)
      shell: bash
      if: github.repository == 'happyvertical/sdk'
      working-directory: packages/github-actions
      run: npm run build

    - name: Run triage (local)
      shell: bash
      if: github.repository == 'happyvertical/sdk'
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        ISSUE_BODY: ${{ github.event.issue.body }}
        ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        CONFIG: ${{ inputs.config-path }}
      run: |
        echo "Triaging issue #$ISSUE_NUMBER: $ISSUE_TITLE"
        node packages/github-actions/dist/cli.js triage

    - name: Run triage (published package)
      shell: bash
      if: github.repository != 'happyvertical/sdk'
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        ISSUE_BODY: ${{ github.event.issue.body }}
        ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        CONFIG: ${{ inputs.config-path }}
      run: |
        echo "Triaging issue #$ISSUE_NUMBER: $ISSUE_TITLE"
        # Configure npm for GitHub Packages
        echo "@happyvertical:registry=https://npm.pkg.github.com" >> ~/.npmrc
        echo "//npm.pkg.github.com/:_authToken=$GITHUB_TOKEN" >> ~/.npmrc
        # Install and run
        npx --yes @happyvertical/github-actions@latest triage
