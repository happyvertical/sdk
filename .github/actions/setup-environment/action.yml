name: 'Setup Environment'
description: 'Setup Node.js, pnpm, system dependencies, and install project dependencies'
author: 'Happy Vertical'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24'

  install-deps:
    description: 'Whether to install project dependencies'
    required: false
    default: 'true'

  registry-url:
    description: 'npm registry URL (for publishing)'
    required: false
    default: ''

outputs:
  pnpm-cache-hit:
    description: 'Whether pnpm cache was hit'
    value: ${{ steps.pnpm-cache.outputs.cache-hit }}

  store-path:
    description: 'pnpm store path'
    value: ${{ steps.pnpm-store.outputs.path }}

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        # Fetch full history for semantic-release if registry-url is set
        fetch-depth: ${{ inputs.registry-url != '' && 0 || 1 }}

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url || 'https://registry.npmjs.org' }}

    - name: Setup pnpm
      uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
      with:
        run_install: false

    - name: Configure pnpm store directory
      shell: bash
      run: |
        store_root="${PNPM_STORE_DIR:-/home/runner/.local/share/pnpm/store}"
        mkdir -p "$store_root"
        pnpm config set store-dir "$store_root" --location=user

    - name: Get pnpm store directory
      id: pnpm-store
      shell: bash
      run: |
        echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

    - name: Setup pnpm cache
      id: pnpm-cache
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install system dependencies for ONNX Runtime
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y \
          libstdc++6 \
          libc6-dev \
          build-essential \
          gcc \
          g++ \
          cmake \
          libgomp1 \
          libprotobuf-dev

    - name: Install project dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        # Force ONNX Runtime to skip CUDA installation
        ONNXRUNTIME_NODE_INSTALL_CUDA: 'skip'
        # GitHub Packages auth for @happyvertical/* packages
        NODE_AUTH_TOKEN: ${{ github.token }}
