name: 'Setup Environment'
description: 'Setup Node.js, pnpm, system dependencies, and install project dependencies'
author: 'Happy Vertical'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24.18.0'
  install-deps:
    description: 'Whether to install project dependencies'
    required: false
    default: 'true'
  registry-url:
    description: 'npm registry URL (for publishing)'
    required: false
    default: ''
  auth-token:
    description: 'Authentication token for the selected npm registry'
    required: false
    default: ''
  github-packages-token:
    description: 'GitHub Packages token override; defaults to the workflow token'
    required: false
    default: ''
  allow-ephemeral-store:
    description: >-
      Accept a cold per-job pnpm store on a self-hosted runner that does not
      export PNPM_STORE_DIR. Unset, the CI_ALLOW_EPHEMERAL_PNPM_STORE
      environment variable decides and a missing store is a hard error.
    required: false
    default: ''

outputs:
  pnpm-cache-hit:
    description: 'Whether the hosted-runner pnpm cache was hit'
    value: ${{ steps.pnpm-cache.outputs.cache-hit }}
  store-path:
    description: 'pnpm store path'
    value: ${{ steps.pnpm-store.outputs.path }}
  use-actions-cache:
    description: 'Whether the pnpm store is backed by the hosted Actions cache'
    value: ${{ steps.pnpm-store-strategy.outputs.use-actions-cache }}

runs:
  using: 'composite'
  steps:
    - name: Check Node.js version
      id: node-check
      shell: bash
      run: |
        required="${{ inputs.node-version }}"
        current=$(node -v 2>/dev/null | sed 's/^v//' || true)
        if node - "$current" "$required" <<'NODE'
        const current = process.argv[2].split('.').map(Number);
        const required = process.argv[3].split('.').map(Number);
        const valid = current.length === 3 && required.length === 3 &&
          !current.some(Number.isNaN) && !required.some(Number.isNaN);
        const satisfies = valid && current[0] === required[0] &&
          (current[1] > required[1] ||
            (current[1] === required[1] && current[2] >= required[2]));
        process.exit(satisfies ? 0 : 1);
        NODE
        then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "Node.js $current satisfies $required; skipping setup"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Node.js ${current:-missing} does not satisfy $required"
        fi

    - name: Setup Node.js
      if: steps.node-check.outputs.skip != 'true'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url || 'https://registry.npmjs.org' }}

    - name: Configure npm registry auth
      if: inputs.auth-token != '' && inputs.registry-url != ''
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.auth-token }}
      run: |
        registry_host="${{ inputs.registry-url }}"
        registry_host="${registry_host#https://}"
        registry_host="${registry_host#http://}"
        registry_host="${registry_host%/}"
        user_config="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
        mkdir -p "$(dirname "$user_config")"
        touch "$user_config"
        npm config set registry "${{ inputs.registry-url }}" --location=user
        printf '\n//%s/:_authToken=%s\n//%s/:always-auth=true\n' \
          "$registry_host" "$NODE_AUTH_TOKEN" "$registry_host" >> "$user_config"

    - name: Configure GitHub Packages auth
      if: inputs.github-packages-token != '' || github.token != ''
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.github-packages-token || github.token }}
      run: |
        user_config="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
        mkdir -p "$(dirname "$user_config")"
        touch "$user_config"
        printf '\n%s\n%s\n' \
          "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" \
          '//npm.pkg.github.com/:always-auth=true' >> "$user_config"

    - name: Check pnpm
      id: pnpm-check
      shell: bash
      run: |
        required=$(node -e "const match=(require('./package.json').packageManager||'').match(/^pnpm@(.+)$/); process.stdout.write(match?.[1]||'')")
        echo "required-version=$required" >> "$GITHUB_OUTPUT"
        current=$(pnpm --version 2>/dev/null || true)
        if [ -n "$required" ] && [ "$current" = "$required" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "pnpm $current already installed; skipping setup"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "pnpm ${current:-missing}; need $required"
        fi

    - name: Setup pnpm
      if: steps.pnpm-check.outputs.skip != 'true'
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        version: ${{ steps.pnpm-check.outputs.required-version }}
        run_install: false

    - name: Determine pnpm store strategy
      id: pnpm-store-strategy
      shell: bash
      # Passed under its own name so the script owns the precedence. Binding
      # the input straight onto CI_ALLOW_EPHEMERAL_PNPM_STORE would clobber an
      # inherited value with an empty string whenever the input is unset.
      env:
        INPUT_ALLOW_EPHEMERAL_STORE: ${{ inputs.allow-ephemeral-store }}
      # Invoked through bash so the step does not depend on the executable bit
      # surviving checkout.
      run: bash "$GITHUB_ACTION_PATH/select-pnpm-store.sh"

    - name: Configure pnpm store directory
      shell: bash
      run: |
        store_root="${{ steps.pnpm-store-strategy.outputs.store-root }}"
        mkdir -p "$store_root"
        pnpm config set store-dir "$store_root" --location=user

    - name: Get pnpm store directory
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Setup hosted-runner pnpm cache
      id: pnpm-cache
      if: steps.pnpm-store-strategy.outputs.use-actions-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install system dependencies for ONNX Runtime
      shell: bash
      run: |
        if command -v dpkg >/dev/null 2>&1 &&
          dpkg -s libprotobuf-dev build-essential libgomp1 >/dev/null 2>&1; then
          echo 'ONNX/native dependencies are preinstalled; skipping apt'
          exit 0
        fi

        # Runners that do not ship apt (the NixOS pxe-farm hosts, for example)
        # provision these dependencies in the image, so there is nothing to do
        # here. Falling through to apt on those hosts failed setup with
        # "sudo: command not found" and took the whole job down before it
        # reached any repository code. A build step that genuinely lacks a
        # library still fails on its own, with an error that names it.
        if ! command -v apt-get >/dev/null 2>&1; then
          echo 'apt-get unavailable; relying on image-provided native dependencies'
          exit 0
        fi

        # Root containers have apt but no sudo.
        sudo=''
        if [ "$(id -u)" -ne 0 ]; then
          if ! command -v sudo >/dev/null 2>&1; then
            echo '::error::apt-get requires root privileges but sudo is unavailable'
            exit 1
          fi
          sudo=sudo
        fi

        $sudo apt-get update
        $sudo apt-get install -y \
          libstdc++6 libc6-dev build-essential gcc g++ cmake libgomp1 libprotobuf-dev

    - name: Install project dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.github-packages-token || inputs.auth-token || github.token }}
        NPM_TOKEN: ${{ inputs.auth-token }}
        ONNXRUNTIME_NODE_INSTALL_CUDA: 'skip'
      run: pnpm install --frozen-lockfile --loglevel error
